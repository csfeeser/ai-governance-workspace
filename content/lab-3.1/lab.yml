title: Reviewer Metrics and Anomaly Detection
tabs:
  - id: log
    title: The Log
    type: steps
    steps:
      - title: Understand the review log
        text: |
          Companies often say "a human checks the AI's work". In this lab you check whether that is really true for PolicyPal.

          When PolicyPal gets a question it is not sure about, the answer is flagged for a person to look at. For each flagged case, PolicyPal proposes one of three things:

          - **approve:** send the answer to the employee as it is
          - **reject:** do not send the answer
          - **route-to-human:** pass the question to a person in HR

          One of five HR operations reviewers (`R-A` to `R-E`) then makes the final call. The review tool keeps a log of every decision. Below is its export for last quarter's 30 days, 19 May to 17 June: 212 decisions in all.

          Each row shows what PolicyPal proposed (`ai_decision`), what the reviewer decided (`human_decision`), who the reviewer was, the week, and the type of case. The `override` column on the right has been filled in for you.

          Read a few rows, then answer: what does `override` = `1` mean?
        fields:
          - id: row_meaning
            kind: select
            label: "What does override = 1 mean?"
            options:
              - "The reviewer agreed with PolicyPal"
              - "The reviewer made a different call from PolicyPal"
              - "The case was passed to a person in HR"
        answer: "`The reviewer made a different call from PolicyPal`. `1` means `human_decision` is different from `ai_decision`. `0` means the reviewer agreed. Overriding is normal: PolicyPal is not always right. A reviewer who never overrides is the worry."
        show:
          - table: &log
              source: reviewer-log.csv
              computed:
                - {name: override, differs: [ai_decision, human_decision]}
              summary: {column: override, label: overrides}

      - title: Does the overall rate prove the checking is real?
        text: |
          The table below is grouped by reviewer: one row per reviewer, and an **All** row at the bottom for the whole team. The **Rate** column is the override rate: out of every 100 decisions, how many the reviewer changed.

          Look at the **All** row. Across the team, reviewers override PolicyPal on 18% of cases. Does that one number tell you that every reviewer is really checking?
        fields:
          - id: overall_enough
            kind: select
            label: "Does the overall rate show that every reviewer is really checking?"
            options:
              - "Yes: 18% looks healthy, so the checking is fine"
              - "No: an average can hide a reviewer who never disagrees and another who disagrees far too often"
        answer: "`No`. The 18% is an average of five people. One reviewer who approves everything and another who overrides everything can still average out to a normal-looking number. That is why the rest of this lab breaks the numbers down."
        show:
          - table: {<<: *log, group: reviewer, fit: true}

  - id: reviewers
    title: The Reviewers
    type: steps
    steps:
      - title: Spot the reviewer who almost never disagrees
        text: |
          A reviewer whose rate is far below everyone else's might be clicking "approve" without reading. At this point that is only a reason to look closer, not proof.

          Compare the **Rate** for each reviewer below. Which one almost never disagrees with PolicyPal?
        fields:
          - {id: low_reviewer, kind: select, label: "Which reviewer almost never disagrees?", options: [R-A, R-B, R-C, R-D, R-E]}
        answer: "`R-A`, at 2%, when the team average is 18%. The other four are between 14% and 43%."
        show:
          - table: {<<: *log, group: reviewer, fit: true}

      - title: Could R-A just have an easy pile of cases?
        text: |
          Before you suspect anyone, check the innocent explanation. Maybe R-A simply got easy cases that did not need changing. If so, the other reviewers would not change those kinds of case either.

          The two tables below break the numbers down. Each box shows overrides out of decisions: `1/11` means 1 override out of 11 decisions.

          - The first table splits each reviewer's decisions by case type. In the case types where R-A overrides nothing, do the other reviewers override?
          - The second splits them by week. Does R-A override in some weeks and not others?

          Answer both questions below.
        fields:
          - id: easy_pile
            kind: select
            label: "Could an easy pile of cases explain R-A's 2%?"
            options:
              - "Yes: R-A's cases are the kind nobody overrides"
              - "No: other reviewers override the same kinds of case regularly, and R-A almost never does, in any week"
          - id: settle_check
            kind: select
            label: "What one check would settle whether R-A is really reviewing?"
            options:
              - "A second reviewer re-marks a sample of R-A's approvals"
              - "Ask R-A whether they are checking properly"
              - "Move R-A to a different team"
              - "Wait another month and look again"
        answer: |
          - `No`. R-A overrides nothing in four of the five case types (benefits, conduct, expense and travel), yet in each of those types most of the other reviewers override at least one case, and R-B overrides 5 of 10 conduct cases. R-A's rate is zero in three of the four weeks. The one exception is a single `pto` override in week 3: mention it, do not explain it away.
          - `A second reviewer re-marks a sample of R-A's approvals`. It tests the approvals directly, instead of relying on R-A's word or on waiting.
        show:
          - markdown: "#### Each reviewer, split by case type"
          - table: {<<: *log, group: reviewer, split: case_type, fit: true}
          - markdown: "#### Each reviewer, split by week"
          - table: {<<: *log, group: reviewer, split: week, fit: true}

      - title: The reviewer who disagrees the most
        text: |
          The opposite pattern is worth checking too. A reviewer who overrides far more than everyone else might be the problem, or PolicyPal might be doing worse on the cases they happen to get.

          1. In the first table, find the reviewer with the highest rate.
          2. In the next two tables, compare that reviewer's number of decisions (the number after the slash) with everyone else's. Do they get the same kinds of case, and the same mix of PolicyPal proposals?
        fields:
          - {id: high_reviewer, kind: select, label: "Which reviewer disagrees the most?", options: [R-A, R-B, R-C, R-D, R-E]}
          - id: reviewer_or_ai
            kind: select
            label: "Is the high rate about the reviewer or about PolicyPal?"
            options:
              - "PolicyPal: this reviewer gets a harder mix of cases"
              - "The reviewer: they get the same mix of cases and proposals as everyone else"
        answer: |
          - `R-B`, at 43%.
          - `The reviewer`. R-B's case types and PolicyPal proposals are spread much like everyone else's (for example 30 approvals, 8 rejections and 4 routings, against 27 to 32, 7 to 10 and 2 to 6 for the others). Same work, very different decisions: the difference is the reviewer.
        show:
          - table: {<<: *log, group: reviewer, fit: true}
          - markdown: "#### Each reviewer, split by case type"
          - table: {<<: *log, group: reviewer, split: case_type, fit: true}
          - markdown: "#### Each reviewer, split by what PolicyPal proposed"
          - table: {<<: *log, group: reviewer, split: ai_decision, fit: true}

  - id: trend
    title: Trend and Repeats
    type: steps
    steps:
      - title: Is the override rate changing, and is PolicyPal to blame?
        text: |
          The first table below is grouped by week. Read the rate for `W1` to `W4`.

          A rising override rate can mean two very different things: PolicyPal is getting worse, so reviewers have more to fix, or the reviewers are getting stricter. To tell them apart, check PolicyPal's quality for the same period. Its quality review for the quarter is in the second table.
        fields:
          - {id: trend_direction, kind: select, label: "Which way is the override rate moving?", options: ["Going up", "Going down", "Staying about the same"]}
          - id: trend_cause
            kind: select
            label: "Is PolicyPal getting worse?"
            options:
              - "Yes: the rising rate shows PolicyPal's answers are getting worse"
              - "No: PolicyPal's quality held steady, so the change is in how the reviewers are deciding"
        answer: |
          - `Going up`: from 11% in week 1 to 26% in week 4.
          - `No`. The quality review for the same quarter scored 92, above the alarm floor and with no drop. PolicyPal's answers did not get worse, so the rise comes from the reviewers. Worth watching, but not a problem with PolicyPal.
        show:
          - table: {<<: *log, group: week, fit: true}
          - markdown: |
              #### PolicyPal's quality review for the same quarter

              | Period | Answers marked | Business Quality Score | Alarm floor | Drop from baseline |
              |---|---|---|---|---|
              | April to June 2026 | 12 | 92 | 85 | None |

      - title: Check the secret repeat cases
        text: |
          To test whether reviewers are really reading, the company slipped some cases in twice. The same case went to the same reviewer two times, on two different days, a week or two apart. The reviewer did not know it was a repeat.

          A careful reviewer makes the same decision both times. A reviewer who is not really reading may not.

          The table below has one row for each repeated case, one for each reviewer:

          - **First look:** the date the reviewer first saw the case, and what they decided.
          - **Second look:** the date they saw the same case again, and what they decided that time.

          For each row, compare the **First decision** with the **Second decision**. Which reviewer decided the same case two different ways?
        fields:
          - {id: dup_reviewer, kind: select, label: "Which reviewer decided the same case two different ways?", options: [R-A, R-B, R-C, R-D, R-E, "None of them"]}
        answer: "`R-D`, on case `DUP-04`: approve on 27 May, reject on 11 June. Everyone else made the same decision both times. Note that R-A was consistent too: consistency alone does not prove someone is reading, because approving everything is also consistent."
        show:
          - table:
              source: repeat-cases.csv
              tools: false
              fit: true
              labels:
                case: Case
                reviewer: Reviewer
                case_type: Case type
                ai_decision: PolicyPal proposed
                first_date: First look (date)
                first_decision: First decision
                second_date: Second look (date)
                second_decision: Second decision

  - id: next
    title: Next Step
    type: steps
    steps:
      - title: Decide who owns fixing the R-A finding
        text: |
          R-A's pattern is the most serious finding. In plain words: R-A's approvals are not getting a real, independent check, and you have already ruled out the innocent explanation (an easy pile of cases).

          The fix will be a change to how reviewing is done. For example, a second reviewer could check a sample of R-A's approvals, or R-A could be re-trained on the review standard. So the finding goes to whoever runs the review process, not to whoever runs the AI.

          The first table below says what each possible owner is responsible for. Your earlier answers about R-A are under it. Choose who owns the fix, and write one line saying why. Lab 3.2 is where you write the plan.
        fields:
          - id: next_owner
            kind: select
            label: "Who owns fixing the R-A finding?"
            options:
              - "The function that runs the human review process for PolicyPal"
              - "The platform / technical owner"
              - "The team that owns the HR policy library"
              - "No one yet: 2% could just be an easy pile"
          - {id: next_why, kind: text, label: "Why? One line."}
        answer: "`The function that runs the human review process for PolicyPal`. It is the only one of the four that can change how reviewing is done: who reviews, how, and whether a second reviewer checks. The platform team runs the AI and the HR policy team writes the policies; neither manages the reviewers. And the easy-pile explanation was ruled out in Step 4."
        show:
          - markdown: |
              #### Who is responsible for what

              | Owner | What they are responsible for |
              |---|---|
              | The function that runs the human review process for PolicyPal | The five reviewers and how they work: who reviews which cases, their training on the review standard, and extra checks such as a second reviewer |
              | The platform / technical owner | The technology behind PolicyPal: the AI model, the software, sign-in, and speed |
              | The team that owns the HR policy library | The HR policy documents PolicyPal reads from, and keeping them current |
          - answers: [low_reviewer, easy_pile, settle_check]

  - id: answer
    title: My Findings
    type: report
    heading: Reviewer Findings
    intro: "What was checked: the PolicyPal human-review log for 19 May to 17 June 2026, 212 decisions by five reviewers. The metrics point to who to look at and what to check next; they do not hand you a verdict. The R-A finding is what Lab 3.2 is about. To keep a copy, click Save as PDF."
    sections:
      - {title: "The overall rate", fields: [overall_enough]}
      - {title: "Low-override outlier", fields: [low_reviewer, easy_pile, settle_check]}
      - {title: "High-override outlier", fields: [high_reviewer, reviewer_or_ai]}
      - {title: "Weekly trend", fields: [trend_direction, trend_cause]}
      - {title: "Repeat cases", fields: [dup_reviewer]}
      - {title: "Next step", fields: [next_owner, next_why]}

