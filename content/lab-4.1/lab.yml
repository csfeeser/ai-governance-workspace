title: Triage and Route Five Incidents
tabs:
  - id: answer
    title: Triage
    type: steps
    steps:
      - title: Sort incident 1
        text: |
          Your company runs several AI tools, not just PolicyPal. When something goes wrong with any of them, anyone can report it to the company's AI incident queue. Each week, one Business AI Owner is on the triage rota: they sort every new report and send it to the right owner. This week it is you, and five incidents have come in.

          Triage means sorting problems by type and urgency, the way nurses sort patients in an emergency room. You are not fixing anything. You are getting each problem to the person who can fix it, at the right speed.

          For each incident you choose three things:

          - **Category:** what kind of problem it is.
          - **Responsible owner:** who should deal with it. Route by responsibility: send it to whoever runs the thing that went wrong, not to a department that will have to pass it on.
          - **Action:** how quickly.

          The categories, the owners and the actions are explained under the incident. Start with incident 1.
        fields:
          - id: i1-cat
            kind: select
            label: "Category"
            options: &cats ["Business rule", "Business content", "Security or privacy", "Technical or vendor", "Risk or compliance"]
          - id: i1-owner-r
            kind: select
            label: "Responsible owner"
            options: &owners
              - "The team that owns the HR policy library"
              - "The IT department, which will pass it to the right team"
              - "The team responsible for the platform and the vendor relationship"
              - "The HR department, which will pass it to the right team"
              - "The information-security function, with the legal function notified"
              - "The legal department, which will pass it to the right team"
              - "The risk and compliance function"
          - id: i1-action
            kind: select
            label: "Action"
            options: &acts ["Escalate immediately", "Escalate now", "Monitor and log, do not escalate yet"]
        answer: |
          - Category: `Business content`. PolicyPal faithfully repeated an out-of-date policy document, so the fix is to remove the old document from what it reads, not to change the AI.
          - Owner: `The team that owns the HR policy library`. They own the documents.
          - Action: `Escalate now`. Employees are getting a wrong figure and two have already acted on it, but no private data is exposed.
        show:
          - doc: incidents.md
            section: Incident 1
          - markdown: &guide |
              #### The five categories

              - **Business rule:** the AI broke a rule the business set for it.
              - **Business content:** the material the AI reads from is wrong, missing, or out of date.
              - **Security or privacy:** private data was shown, leaked, or misused.
              - **Technical or vendor:** the computer system, the AI model, the connections, or the speed.
              - **Risk or compliance:** the company could get into legal, regulatory, or money trouble.

              #### Who is responsible for what

              | Owner | What they are responsible for |
              |---|---|
              | The team that owns the HR policy library | The HR policy documents the HR assistant reads from |
              | The team responsible for the platform and the vendor relationship | The AI tools' technology: the models, the software, speed and uptime, and the contracts with the AI vendors |
              | The information-security function, with the legal function notified | Leaks and misuse of private or confidential data |
              | The risk and compliance function | Legal, regulatory, tax and financial risk to the company |
              | The IT, HR or legal department | A whole department. Someone there has to work out who should deal with it, which costs time. |

              #### The three actions

              - **Escalate immediately:** private or confidential data is exposed, or harm is spreading right now. Act today, within hours.
              - **Escalate now:** a real error or harm that needs fixing. Raise it with the owner this week; do not wait for the monthly review.
              - **Monitor and log, do not escalate yet:** a known problem with no measured harm yet. Record it, watch it, and decide in advance what would make you escalate.

      - title: Sort incident 2
        text: |
          Choose the category, the responsible owner, and the action for incident 2. The categories, owners and actions are explained under the incident.
        fields:
          - {id: i2-cat, kind: select, label: "Category", options: *cats}
          - {id: i2-owner-r, kind: select, label: "Responsible owner", options: *owners}
          - {id: i2-action, kind: select, label: "Action", options: *acts}
        answer: |
          - Category: `Technical or vendor`. The AI model version changed and the output changed with it.
          - Owner: `The team responsible for the platform and the vendor relationship`. They run the model and the vendor contract.
          - Action: `Escalate now`. About 200 customer emails a week are affected, but nothing private is exposed.
        show:
          - doc: incidents.md
            section: Incident 2
          - markdown: *guide

      - title: Sort incident 3
        text: |
          Choose the category, the responsible owner, and the action for incident 3.
        fields:
          - {id: i3-cat, kind: select, label: "Category", options: *cats}
          - {id: i3-owner-r, kind: select, label: "Responsible owner", options: *owners}
          - {id: i3-action, kind: select, label: "Action", options: *acts}
        answer: |
          - Category: `Security or privacy`. Another customer's private data was shown.
          - Owner: `The information-security function, with the legal function notified`. A data exposure may have legal reporting duties, so legal must know too.
          - Action: `Escalate immediately`. Nobody knows how many sessions were affected or whether it is still happening.
        show:
          - doc: incidents.md
            section: Incident 3
          - markdown: *guide

      - title: Sort incident 4, which fits two categories
        text: |
          Real problems do not always fit one box. Incident 4 fits two categories. When that happens, you handle the bigger risk first.

          1. Decide which two categories fit.
          2. Put the one that matters more in **The category that matters more**, and the other in **The other category that also fits**.
          3. Choose the responsible owner and the action.
          4. Write one line saying why that risk is the bigger one.
        fields:
          - {id: i4-cat, kind: select, label: "The category that matters more", options: *cats}
          - {id: i4-other, kind: select, label: "The other category that also fits", options: *cats}
          - {id: i4-owner-r, kind: select, label: "Responsible owner", options: *owners}
          - {id: i4-action, kind: select, label: "Action", options: *acts}
          - {id: i4-why, kind: text, label: "One line: why does that risk matter more?"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "Someone acting on ______ could ______, which is a bigger harm than ______."'
        answer: |
          - The category that matters more: `Risk or compliance`. The assistant gave a confident, wrong tax answer that someone has already acted on, and could lead to a misstated filing.
          - The other category: `Business content`. The tax guidance document the assistant reads from is out of date.
          - Owner: `The risk and compliance function`. You may also tell whoever owns the tax document, but the escalation goes to risk and compliance.
          - Action: `Escalate now`.
          - Why: "Someone acting on wrong tax advice could misstate a filing, which is a bigger harm than an outdated document sitting in the source."
        show:
          - doc: incidents.md
            section: Incident 4
          - markdown: *guide

      - title: Sort incident 5
        text: |
          Choose the category, the responsible owner, and the action for incident 5.

          Then, in the last box, say what would have to change for this incident to need escalating now.
        fields:
          - {id: i5-cat, kind: select, label: "Category", options: *cats}
          - {id: i5-owner-r, kind: select, label: "Responsible owner", options: *owners}
          - {id: i5-action, kind: select, label: "Action", options: *acts}
          - {id: i5-trigger, kind: text, label: "What would have to change for this to need escalating now?"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "I would escalate if ______ were measured as ______, or if it started happening ______."'
        answer: |
          - Category: `Technical or vendor`. A slow-down that repeats every morning.
          - Owner: `The team responsible for the platform and the vendor relationship`. They run the platform, and they already know about it.
          - Action: `Monitor and log, do not escalate yet`. It comes and goes, the platform team knows about it, and nobody has measured what it costs.
          - What would change it: "I would escalate if the lost requests were measured as holding up real work, or if it started happening at other times of day."
        show:
          - doc: incidents.md
            section: Incident 5
          - markdown: *guide

  - id: next
    title: Next Moves
    type: steps
    steps:
      - title: Pick the one incident you would deal with first
        text: |
          With five problems you cannot fix everything at once, so you need a way to choose. Think about how much harm each one does and how urgent it is.

          All five incidents are below again, followed by your triage choices. Choose the incident you would escalate first, and write one line saying why.
        fields:
          - {id: first, kind: select, label: "The one incident you would escalate first", options: ["Incident 1", "Incident 2", "Incident 3", "Incident 4", "Incident 5"]}
          - {id: first-why, kind: text, label: "One line: why? (harm combined with urgency)"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "Because ______ has the highest ______ and the highest ______."'
        answer: "`Incident 3`. Private data is being shown right now and nobody knows how far it has spread. It is both the most harmful and the most urgent."
        show:
          - doc: incidents.md
          - answers: [i1-cat, i1-action, i2-cat, i2-action, i3-cat, i3-action, i4-cat, i4-action, i5-cat, i5-action]

      - title: Decide what to do when the handoff stalls
        text: |
          Passing a problem on is not the same as solving it. Here is what happened next with incident 2:

          > You sent incident 2 to the team responsible for the platform and the vendor relationship on Monday, asking for a reply within 3 business days. It is now the following Tuesday. There has been no reply, and the assistant is still drafting off-tone customer emails.

          What is your best next move?
        fields:
          - id: stall_move
            kind: select
            label: "Your best next move"
            options:
              - "Wait for next month's review and raise the incident with the platform team again there"
              - "Escalate to the platform team's manager, attaching the ticket and the date that was missed"
              - "Change the sales assistant's settings yourself so the customer emails go back to normal"
              - "Re-send the same ticket to the IT department in case someone there can pick it up faster"
        answer: "`Escalate to the platform team's manager`, with the ticket and the date that was missed. The owner is right; they are just not responding, so you go one level up. Waiting a month leaves customers getting off-tone emails. Changing the settings yourself is not your job and bypasses the owner. Sending it to a department only adds another handoff."

  - id: report
    title: My Triage
    type: report
    heading: Triage
    intro: "This week's AI incident triage: each incident with its category, its owner named by responsibility, and how quickly to act. Routing a finding is not the same as closing it. To keep a copy, click Save as PDF."
    sections:
      - {title: "Incident 1", fields: [i1-cat, i1-owner-r, i1-action]}
      - {title: "Incident 2", fields: [i2-cat, i2-owner-r, i2-action]}
      - {title: "Incident 3", fields: [i3-cat, i3-owner-r, i3-action]}
      - {title: "Incident 4", fields: [i4-cat, i4-other, i4-owner-r, i4-action, i4-why]}
      - {title: "Incident 5", fields: [i5-cat, i5-owner-r, i5-action, i5-trigger]}
      - {title: "Escalate first", fields: [first, first-why]}
      - {title: "When the handoff stalls", fields: [stall_move]}
