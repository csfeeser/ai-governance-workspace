title: Triage and Route Five Incidents
tabs:
  - id: incidents
    title: Incident Log
    type: doc
    source: incidents.md
  - id: answer
    title: My Triage
    type: form
    heading: Triage Table
    intro: "Read all five incidents on the Incident Log tab before you classify any. For each incident choose a category, give a one-line reason, and route it to an owner named by what they are responsible for, not by department."
    sections:
      - title: "Incident 1"
        fields:
          - {id: i1-cat, kind: select, label: "Category", options: &cats ["Business rule", "Business content", "Security or privacy", "Technical or vendor", "Risk or compliance"]}
          - {id: i1-why, kind: text, label: "One-line reason"}
          - {id: i1-owner, kind: text, label: "Responsible owner (by responsibility)", example: "The team that runs the affected process or maintains the affected thing."}
          - {id: i1-urg, kind: select, label: "Urgency", options: &urg ["Immediate", "Elevated", "Routine"]}
          - {id: i1-esc, kind: select, label: "Escalate now?", options: &esc ["Yes, escalate now", "No, monitor and log"]}
          - {id: i1-stall, kind: text, label: "If the route stalls, what is your next move?"}
      - title: "Incident 2"
        fields:
          - {id: i2-cat, kind: select, label: "Category", options: *cats}
          - {id: i2-why, kind: text, label: "One-line reason"}
          - {id: i2-owner, kind: text, label: "Responsible owner (by responsibility)"}
          - {id: i2-urg, kind: select, label: "Urgency", options: *urg}
          - {id: i2-esc, kind: select, label: "Escalate now?", options: *esc}
          - {id: i2-stall, kind: text, label: "If the route stalls, what is your next move?"}
      - title: "Incident 3"
        help: "Security or privacy incidents do not wait for the monthly review. Flag the urgency."
        fields:
          - {id: i3-cat, kind: select, label: "Category", options: *cats}
          - {id: i3-why, kind: text, label: "One-line reason"}
          - {id: i3-owner, kind: text, label: "Responsible owner (by responsibility)"}
          - {id: i3-urg, kind: select, label: "Urgency", options: *urg}
          - {id: i3-esc, kind: select, label: "Escalate now?", options: *esc}
          - {id: i3-stall, kind: text, label: "If the route stalls, what is your next move?"}
      - title: "Incident 4"
        help: "This one fits two categories. Write both readings before you pick one."
        fields:
          - {id: i4-read1, kind: text, label: "First reading (category and why)"}
          - {id: i4-read2, kind: text, label: "Second reading (category and why)"}
          - {id: i4-cat, kind: select, label: "Which category matters more?", options: *cats}
          - {id: i4-why, kind: text, label: "Why does that risk dominate?"}
          - {id: i4-owner, kind: text, label: "Responsible owner (by responsibility)"}
          - {id: i4-urg, kind: select, label: "Urgency", options: *urg}
          - {id: i4-esc, kind: select, label: "Escalate now?", options: *esc}
          - {id: i4-stall, kind: text, label: "If the route stalls, what is your next move?"}
      - title: "Incident 5"
        help: "Decide whether this meets the bar to escalate now, and state your threshold."
        fields:
          - {id: i5-cat, kind: select, label: "Category", options: *cats}
          - {id: i5-why, kind: text, label: "One-line reason"}
          - {id: i5-owner, kind: text, label: "Responsible owner (by responsibility)"}
          - {id: i5-urg, kind: select, label: "Urgency", options: *urg}
          - {id: i5-esc, kind: select, label: "Escalate now?", options: *esc}
          - {id: i5-threshold, kind: text, label: "What threshold would make you escalate it?"}
          - {id: i5-stall, kind: text, label: "If the route stalls, what is your next move?"}
      - title: "Org-chart check"
        help: "Re-read every responsible owner you wrote. If any names an actual department, rewrite it as a responsibility. Then choose the one incident you would escalate first."
        fields:
          - {id: first, kind: select, label: "The one incident you escalate first", options: ["Incident 1", "Incident 2", "Incident 3", "Incident 4", "Incident 5"]}
          - {id: first-why, kind: text, label: "Why (impact combined with urgency)"}
