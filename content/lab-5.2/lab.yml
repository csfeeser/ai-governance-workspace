title: The Auditor's Read
tabs:
  - id: packet
    title: Submitted Packet
    about:
      what: "A finished evidence packet that somebody else put together."
      why: "This time you are the auditor. An auditor is a person who checks a company's proof. Read it as someone who does not trust it yet: is there enough here to believe the company really watched over its AI?"
      todo: "Read all of it. Do not fix anything. Just notice what is wrong or missing."
    type: doc
    source: submitted-packet.md
  - id: answer
    title: Auditor Findings
    about:
      what: "Your report on the packet: what is wrong with it, which problem is the worst, and whether you would accept it."
      why: "A finding is a problem that an auditor writes down. Writing findings clearly is how you make sure the company fixes them."
      todo: "Fill it in from top to bottom, following the lab steps."
    type: form
    heading: Auditor Findings
    intro: "Read the packet as an auditor would. The question is not whether it is neat, but whether there is enough here to believe oversight happened."
    sections:
      - title: "Check each of the six required components"
        help: "Is each one present in substance, or only in name?"
        fields:
          - {id: c1, kind: select, label: "1. Business purpose statement", options: &comp ["Present in substance", "Present in name only", "Missing"]}
          - {id: c2, kind: select, label: "2. System instructions and baseline business rules", options: *comp}
          - {id: c3, kind: select, label: "3. Sampled review records and quality scores", options: *comp}
          - {id: c4, kind: select, label: "4. HITL override summary and reviewer quality audit", options: *comp}
          - {id: c5, kind: select, label: "5. Incident and escalation history", options: *comp}
          - {id: c6, kind: select, label: "6. Change-control and approval log", options: *comp}
      - title: "Finding 1"
        fields:
          - {id: f1-where, kind: select, label: "Where in the packet is it?", options: &where ["Section 1", "Section 2", "Section 3", "Section 4", "Section 5", "Section 6", "The retention-location column across the whole index"]}
          - {id: f1-what, kind: textarea, rows: 3, label: "What is wrong, why an auditor cares, and what would fix it"}
      - title: "Finding 2"
        fields:
          - {id: f2-where, kind: select, label: "Where in the packet is it?", options: *where}
          - {id: f2-what, kind: textarea, rows: 3, label: "What is wrong, why an auditor cares, and what would fix it"}
      - title: "Finding 3"
        fields:
          - {id: f3-where, kind: select, label: "Where in the packet is it?", options: *where}
          - {id: f3-what, kind: textarea, rows: 3, label: "What is wrong, why an auditor cares, and what would fix it"}
      - title: "Rank by severity"
        fields:
          - {id: worst, kind: select, label: "Most severe finding", options: ["Finding 1", "Finding 2", "Finding 3"]}
      - title: "Your decision"
        fields:
          - {id: accept, kind: select, label: "Would you accept the packet as it stands?", options: ["Yes, accept as it stands", "No, do not accept yet"]}
          - {id: accept-why, kind: text, label: "One line: why, and what it needs"}
  - id: challenges
    title: Challenges
    about:
      what: "Three optional bonus questions, called bronze, silver and gold."
      why: "For people who finish early. Nobody has to do them."
      todo: "Type your answers here if you try them."
    type: form
    optional: true
    heading: Challenges
    intro: "Optional. Each challenge stands alone."
    sections:
      - title: "Bronze"
        help: "There is a fourth, softer weakness. The packet claims to cover 2026-Q2 to 2026-Q3, but look at what actually evidences each part of that span. For a workflow on a monthly review cadence, how many review records should a six-month packet contain, and how many does this one have?"
        fields:
          - {id: bronze, kind: textarea, rows: 4, label: "The finding, and why it is less severe than the three main defects"}
      - title: "Silver"
        fields:
          - {id: silver, kind: textarea, rows: 4, label: "For each of your three findings: which of the six packet components it sits in, and which auditor question it fails to answer"}
      - title: "Gold"
        fields:
          - {id: gold, kind: textarea, rows: 6, label: "A one-page auditor's finding memo: finding, risk rating, recommendation, and a management-response line"}
