title: The Auditor's Read
tabs:
  - id: packet
    title: The Packet
    type: steps
    steps:
      - title: Read the packet all the way through
        text: |
          This time you are the auditor: the person who checks a company's proof. Someone else has built an evidence packet, and it looks good at first glance. You will read it like someone who does not trust it yet, and write down what is wrong.

          Read the whole packet below, from top to bottom. Do not judge anything yet, and do not fix anything. The question an auditor asks is not "is this neat?". It is "is there enough here to believe the company really watched over its AI?"

          There is nothing to type in this step.
        show:
          - doc: submitted-packet.md

      - title: Check each of the six sections
        text: |
          Every packet must have six sections. A section can look fine because it has a heading and an entry, and still fail to prove what the section is for.

          For each section, choose one:

          - **Present in substance:** it really proves what it should.
          - **Present in name only:** it is there, but it does not prove it.
          - **Missing:** it is not there at all.

          The six sections of the packet are below again.
        fields:
          - {id: c1, kind: select, label: "1. Business purpose statement", options: &comp ["Present in substance", "Present in name only", "Missing"]}
          - {id: c2, kind: select, label: "2. System instructions and baseline business rules", options: *comp}
          - {id: c3, kind: select, label: "3. Sampled review records and quality scores", options: *comp}
          - {id: c4, kind: select, label: "4. HITL override summary and reviewer quality audit", options: *comp}
          - {id: c5, kind: select, label: "5. Incident and escalation history", options: *comp}
          - {id: c6, kind: select, label: "6. Change-control and approval log", options: *comp}
        answer: "Sections 1, 2, 5, and 6 are present in substance. Sections 3 and 4 are present in name only. Section 3 gives a quality score that nobody can interpret, and section 4 gives numbers for the reviewers but no judgement on whether they were doing their job."
        show:
          - doc: submitted-packet.md
            section: 1. Business purpose statement
          - doc: submitted-packet.md
            section: 2. System instructions and baseline business rules
          - doc: submitted-packet.md
            section: 3. Sampled review records and quality scores
          - doc: submitted-packet.md
            section: 4. HITL override summary and reviewer quality audit
          - doc: submitted-packet.md
            section: 5. Incident and escalation history
          - doc: submitted-packet.md
            section: 6. Change-control and approval log

  - id: answer
    title: Findings
    type: steps
    steps:
      - title: "Write finding 1: the human checking"
        text: |
          Section 4, below, is about whether the human checking was real. It gives override rates for each reviewer. Ask: what in this section tells an auditor whether the reviewers themselves are doing real checking?

          1. Choose where in the packet the problem is.
          2. Write what is wrong, why an auditor would care, and what would fix it.
        fields:
          - {id: f1-where, kind: select, label: "Where in the packet is it?", options: &where ["Section 1", "Section 2", "Section 3", "Section 4", "Section 5", "Section 6", "The retention-location column across the whole index"]}
          - {id: f1-what, kind: textarea, rows: 3, label: "What is wrong, why an auditor cares, and what would fix it"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "Section ______ gives ______ but contains no ______, so an auditor cannot tell whether ______. Fix: add ______."'
        answer: "`Section 4`. It gives override rates for each reviewer but has no assessment of the reviewers themselves. Nothing tells the auditor whether the reviewers are really checking, and the table of rates does not show that anyone looked into R-A's 2%. The fix is to add the assessment of the reviewers."
        show:
          - doc: submitted-packet.md
            section: 4. HITL override summary and reviewer quality audit

      - title: "Write finding 2: the quality score"
        text: |
          Section 3, below, has a Business Quality Score. A number by itself only means something if you know what it was measured against. Ask: can I tell what this number means?

          Nothing in the packet says which quality standard (rulebook) the score was marked against. There is no version, no list of rules, and no link.

          1. Choose where in the packet the problem is.
          2. Write what is wrong, why an auditor would care, and what would fix it.
        fields:
          - {id: f2-where, kind: select, label: "Where in the packet is it?", options: *where}
          - {id: f2-what, kind: textarea, rows: 3, label: "What is wrong, why an auditor cares, and what would fix it"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "The Business Quality Score of ______ has no ______ attached, so an auditor cannot tell what it ______. Fix: attach ______."'
        answer: "`Section 3`. \"Business Quality Score: 82\" means nothing unless you know the rulebook it was marked against. A different rulebook would give a different number. The fix is to attach the quality standard, with its version."
        show:
          - doc: submitted-packet.md
            section: 3. Sampled review records and quality scores

      - title: "Write finding 3: where the records are kept"
        text: |
          Records need to be kept somewhere that will still exist when an auditor comes. The last column of every table in the packet below, **Retention location**, says where each paper is kept. Read it for every row.

          Several papers are kept inside the AI platform itself. The AI platforms only keep their records for about 180 days, and then they delete them.

          1. Choose where in the packet the problem is.
          2. Write what is wrong, why an auditor would care, and what would fix it. Link it to how long records must be kept.
        fields:
          - {id: f3-where, kind: select, label: "Where in the packet is it?", options: *where}
          - {id: f3-what, kind: textarea, rows: 3, label: "What is wrong, why an auditor cares, and what would fix it"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "______ of ______ index rows are retained in ______, which keeps only about ______ days, so the evidence is ______. Fix: ______."'
        answer: "`The retention-location column across the whole index`. Four of the nine rows say the papers are kept in \"Copilot audit log\" or \"Purview\". Those are parts of the AI platform itself, and they keep about 180 days of records. If a company has to keep records for several years, this evidence is gone in about seven months, and the packet cannot be rebuilt when it is really needed. The fix is to copy the evidence into a named system that belongs to the company."
        show:
          - doc: submitted-packet.md

  - id: verdict
    title: Verdict
    type: steps
    steps:
      - title: Say which problem is the worst
        text: |
          You have found three problems. Some can be fixed on paper, and some cannot be undone. The one that cannot be undone is the most serious.

          Your three findings are below. Choose the worst one.
        fields:
          - {id: worst, kind: select, label: "Most severe finding", options: ["Finding 1", "Finding 2", "Finding 3"]}
        answer: "`Finding 3`, the records problem, is probably the worst. The other two can be fixed by writing something down, but this evidence will really disappear."
        show:
          - answers: [f1-what, f2-what, f3-what]

      - title: Decide whether you would accept the packet
        text: |
          An auditor's job is to give a clear answer. You either accept the packet, or you do not accept it yet.

          Choose your answer, then write one line saying why, and what the packet still needs. Your findings are below.
        fields:
          - {id: accept, kind: select, label: "Would you accept the packet as it stands?", options: ["Yes, accept as it stands", "No, do not accept yet"]}
          - {id: accept-why, kind: text, label: "One line: why, and what it needs"}
        answer: "`No, do not accept yet`. It needs the assessment of the reviewers, the quality standard, and copies of the evidence kept somewhere that will last."
        show:
          - answers: [f1-what, f2-what, f3-what]

  - id: report
    title: Auditor Findings
    type: report
    heading: Auditor Findings
    intro: "The question is not whether the packet is neat, but whether there is enough here to believe oversight happened. Spotting what is absent is the real test of knowing what auditors expect. To keep a copy, click Save as PDF."
    sections:
      - {title: "The six required components", fields: [c1, c2, c3, c4, c5, c6]}
      - {title: "Finding 1", fields: [f1-where, f1-what]}
      - {title: "Finding 2", fields: [f2-where, f2-what]}
      - {title: "Finding 3", fields: [f3-where, f3-what]}
      - {title: "Rank by severity", fields: [worst]}
      - {title: "Your decision", fields: [accept, accept-why]}

