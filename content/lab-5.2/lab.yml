title: The Auditor's Read
tabs:
  - id: packet
    title: The Packet
    type: steps
    steps:
      - title: Read the packet the way an auditor will
        text: |
          Today is Friday 2026-10-02. Internal audit will want PolicyPal's packet for Q3 (2026-07-01 to 2026-09-30) next, the quarter you have run it since Lab 1.1. A colleague, P. Haddad, has drafted it for you. Before it goes to the auditors, read it the way they will: as someone who does not trust it yet.

          The question an auditor asks is not "is this neat?". It is "is there enough here to believe the company really watched over its AI?" A section can look fine because it has a heading and an entry, and still fail to prove what it is for.

          The top of the packet is below. In the next six steps you see one section at a time, with the auditor's question for it, and judge it right underneath. For each section you choose one:

          - **Present in substance:** it really answers the auditor's question for Q3.
          - **Present in name only:** it has an entry, but an auditor could not use it to answer the question.
          - **Missing:** it is not there at all.

          There is nothing to choose in this step.
        show:
          - doc: submitted-packet.md
            section: Packet header
          - doc: submitted-packet.md
            section: Known gaps

      - title: "Section 1 of 6: Business purpose statement"
        text: |
          The section is above. Judge it against the auditor's question.
        fields:
          - {id: sec1, kind: select, label: "Section 1", options: &comp ["Present in substance", "Present in name only", "Missing"]}
        hints:
          - title: "Hint 1: where to look"
            text: |
              Read the **Item** and **Coverage period** columns. Does the row say what PolicyPal is for, and does it apply to the whole of Q3?
        answer: "`Present in substance`. It says what PolicyPal is for and who uses it, and it applies all through Q3."
        show_first: true
        show:
          - markdown: "#### Section 1 of 6. The auditor's question: What is this tool for?"
          - doc: submitted-packet.md
            section: 1. Business purpose statement

      - title: "Section 2 of 6: System instructions and baseline business rules"
        text: |
          The section is above. Judge it against the auditor's question.
        fields:
          - {id: sec2, kind: select, label: "Section 2", options: *comp}
        hints:
          - title: "Hint 1: where to look"
            text: |
              Q3 runs from 2026-07-01 to 2026-09-30. Read the **Coverage period** of each row. Between them, do the rows cover every day of Q3?
        answer: "`Present in substance`. v2 covers 2026-07-01 to 2026-07-12 and v3 covers 2026-07-13 onward, so between them the rules for every day of Q3 are there."
        show_first: true
        show:
          - markdown: "#### Section 2 of 6. The auditor's question: What was it told to do?"
          - doc: submitted-packet.md
            section: 2. System instructions and baseline business rules

      - title: "Section 3 of 6: Sampled review records and quality scores"
        text: |
          The section is above. Judge it against the auditor's question.
        fields:
          - {id: sec3, kind: select, label: "Section 3", options: *comp}
        hints:
          - title: "Hint 1: where to look"
            text: |
              Read the **Item** column and ask yourself: could you tell from this row alone whether 83 is a good score or a bad one? What would you need to know about how the answers were marked?
        answer: "`Present in name only`. It gives three scores, but nothing says which quality standard, or which version of it, the answers were marked against. Without that nobody can tell what 88, 81 or 83 means."
        show_first: true
        show:
          - markdown: "#### Section 3 of 6. The auditor's question: Did you check its quality, and when?"
          - doc: submitted-packet.md
            section: 3. Sampled review records and quality scores

      - title: "Section 4 of 6: HITL override summary and reviewer quality audit"
        text: |
          The section is above. Judge it against the auditor's question.
        fields:
          - {id: sec4, kind: select, label: "Section 4", options: *comp}
        hints:
          - title: "Hint 1: where to look"
            text: |
              The auditor's question is whether the human checking was real. Does a list of override rates answer that on its own? Think back to Lab 3.1: R-A's 2% looked fine until you worked out what it meant.
        answer: "`Present in name only`. It gives each reviewer's override rate, but nothing says whether the reviewers were really checking. Lab 3.1 showed that a normal-looking number can hide a reviewer who approves everything."
        show_first: true
        show:
          - markdown: "#### Section 4 of 6. The auditor's question: Was the human checking real? (HITL means \"human in the loop\": a person checking the AI.)"
          - doc: submitted-packet.md
            section: 4. HITL override summary and reviewer quality audit

      - title: "Section 5 of 6: Incident and escalation history"
        text: |
          The section is above. Judge it against the auditor's question.
        fields:
          - {id: sec5, kind: select, label: "Section 5", options: *comp}
        hints:
          - title: "Hint 1: where to look"
            text: |
              Go down the list of what happened in Q3, above, and look for each event in the **Item** column of the packet's rows.
        answer: "`Present in substance`. The handover routing, the model change, the PTO policy change and the old PTO document are all there, each with who it went to."
        show_first: true
        show:
          - markdown: "#### Section 5 of 6. The auditor's question: What went wrong, and what did you do about it?"
          - markdown: &q3 |
              #### What happened in Q3, from your earlier labs

              - 2026-07-06: you took over PolicyPal and gave the eight open issues owners (Lab 1.1).
              - 2026-07-13: v3 of PolicyPal's rules took effect, replacing v2.
              - 2026-08-11: the AI model version changed and the score fell from 88 to 81 (Lab 2.1). The platform team moved it back on 2026-08-25.
              - 2026-09-01: PTO Policy 2026 took effect, and the Quality Standard's PTO figures went out of date (Lab 2.2).
              - September: PolicyPal was still citing PTO Policy 2023 for carryover questions (Lab 4.1).
          - doc: submitted-packet.md
            section: 5. Incident and escalation history

      - title: "Section 6 of 6: Change-control and approval log"
        text: |
          The section is above. Judge it against the auditor's question.
        fields:
          - {id: sec6, kind: select, label: "Section 6", options: *comp}
        hints:
          - title: "Hint 1: where to look"
            text: |
              Go down the list of what happened in Q3, above, and pick out the changes made to PolicyPal itself. Look for each one in the **Item** column of the packet's rows.
        answer: "`Present in substance`. The two changes to PolicyPal itself are there: the move to v3 of the rules, and the model version change and move back. The PTO policy change and the old PTO document are changes to the policy library, not to PolicyPal, so they belong in section 5."
        show_first: true
        show:
          - markdown: "#### Section 6 of 6. The auditor's question: What changed, and who approved it?"
          - markdown: *q3
          - doc: submitted-packet.md
            section: 6. Change-control and approval log

  - id: findings
    title: Findings
    type: steps
    steps:
      - title: "Finding 1: the human checking"
        text: |
          A finding is a problem an auditor writes down: what is wrong, why it matters, and what would fix it. You judged two sections present in name only. Start with section 4, above. What is missing from it?
        fields:
          - id: f1-missing
            kind: select
            label: "What is missing from section 4?"
            options:
              - "Any judgement of the reviewers: whether each one really checked, and the result of R-A's July re-check"
              - "How many decisions each reviewer made in Q3, so the auditor can see how busy the review team was"
              - "Q2's override rates next to Q3's, so the auditor can see whether the team's 17% is going up or down"
              - "The names of the five reviewers, so the auditor can interview each one about how they do their reviews"
        hints:
          - title: "Hint 1: where to look"
            text: |
              Section 4's question is "was the human checking real?". An override rate is only a number. Think back to Lab 3.1: what did you have to work out about R-A and R-B before the numbers meant anything? Then think of Lab 3.2's plan for R-A: its re-check was due on 2026-07-18, inside Q3. Is its result anywhere in this packet?
        answer: |
          `Any judgement of the reviewers`. Section 4 gives each reviewer's override rate, but nothing says whether they were really checking. Lab 3.1 showed that a 2% rate can mean a reviewer approves everything, and the result of R-A's re-check on 2026-07-18 is not in the packet at all.

          - Why the auditor cares: without it, the auditor cannot tell whether the human checking was real, which is the whole question of section 4.
          - The fix: add the reviewer quality audit for Q3, with the result of R-A's re-check.
          - Decision counts, Q2's rates and names are all extra numbers or people. None of them says whether anyone checked properly.
        show_first: true
        show:
          - markdown: "#### Section 4. The auditor's question: Was the human checking real?"
          - doc: submitted-packet.md
            section: 4. HITL override summary and reviewer quality audit

      - title: "Finding 2: the quality scores"
        text: |
          Now section 3, above. What is missing from it?
        fields:
          - id: f2-missing
            kind: select
            label: "What is missing from section 3?"
            options:
              - "Which quality standard, and which version of it, the three monthly scores were marked against"
              - "The marked answers themselves, so the auditor can re-mark a few and check the scores are right"
              - "A score for each of the four rules, so the auditor can see which rule caused August's drop"
              - "The name of the person who marked each re-test, so the auditor can check they were trained"
        hints:
          - title: "Hint 1: where to look"
            text: |
              Read the **Item** and **Source file** columns of section 3: what is already there? Then think back to Lab 2.2. What did you find out about the Quality Standard in September, and what would that do to a September score?
        answer: |
          `Which quality standard, and which version of it`. A score only means something against the rulebook it was marked with. In Q3 that rulebook went out of date: PTO Policy 2026 took effect on 2026-09-01, and the Quality Standard still listed the 2025 PTO figures (Lab 2.2). So September's 83 means something different depending on which version was used.

          - Why the auditor cares: without the standard, nobody can tell what 88, 81 or 83 means, or compare them.
          - The fix: attach the Quality Standard, with the version and date each re-test used.
          - The marked answers are already there: `q3-retests.csv` holds all 60. Scores for each rule and the markers' names are useful, but without the standard they still cannot be read.
        show_first: true
        show:
          - markdown: "#### Section 3. The auditor's question: Did you check its quality, and when?"
          - doc: submitted-packet.md
            section: 3. Sampled review records and quality scores

  - id: report
    title: Auditor Findings
    type: report
    heading: Auditor Findings
    intro: "Review of PolicyPal's draft evidence packet for 2026-Q3, read the way internal audit will read it, on 2026-10-02. The question is not whether the packet is neat, but whether there is enough here to believe oversight happened. To keep a copy, click Save as PDF."
    sections:
      - {title: "The six sections", fields: [sec1, sec2, sec3, sec4, sec5, sec6]}
      - {title: "Finding 1: the human checking", fields: [f1-missing]}
      - {title: "Finding 2: the quality scores", fields: [f2-missing]}

