title: Diagnose the Degradation and Document the Test
tabs:
  - id: sample
    title: The Drop
    type: steps
    steps:
      - title: Confirm that the score really dropped
        text: |
          PolicyPal's answers have got worse. In this lab you work out when it started and what caused it, then write it up.

          Somebody has already marked 20 of PolicyPal's answers, so you do not mark anything. The score box below adds up those marks.

          Read the **Current Business Quality Score**, the **Recorded baseline**, and the **Change (points)**. Before you look for a cause, make sure there really is a drop to explain.
        answer: "The current score is `69`, against a recorded baseline of `90`. That is a drop of `21` points."
        show:
          - table: &card
              id: sample
              source: sample.csv
              view: scorecard
              scorecard:
                baseline_bqs: baseline_bqs
                criteria:
                  - {label: "c1 Current, named source", current: current_score_c1, baseline: baseline_score_c1}
                  - {label: "c2 Exact figure or entitlement", current: current_score_c2, baseline: baseline_score_c2}
                  - {label: "c3 Answers the question asked", current: current_score_c3, baseline: baseline_score_c3}
                  - {label: "c4 Human referral where required", current: current_score_c4, baseline: baseline_score_c4}

      - title: Find the date when it went wrong
        text: |
          If the marks dropped suddenly on one day, that day points to what changed. If they crept down slowly, that is a different kind of problem.

          Below are the 20 marked answers, in date order. Each has two marks out of 4: the **Baseline score** it got when the baseline was set, and the **Current score** it gets now.

          Read down those two columns together. Find the first date on which the current mark is lower than the baseline mark, and type that date.
        fields:
          - {id: change_date, kind: text, label: "Date the quality drop begins"}
        hints:
          - title: "Hint 1: where to look"
            text: "Look for the first row where the current mark is lower than the baseline mark. Then ask: do the low marks start at one point, or are they spread out evenly?"
        answer: "`2026-08-12`. Answers on or after that date get much lower marks, and answers before it are at or near their baseline. It is a sudden step down, not a slow slide."
        show:
          - table: &sampletable
              source: sample.csv
              computed:
                - {name: baseline_total, sum: [baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4]}
                - {name: current_total, sum: [current_score_c1, current_score_c2, current_score_c3, current_score_c4]}
              hide: [baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4, baseline_bqs, current_score_c1, current_score_c2, current_score_c3, current_score_c4]
              labels:
                case_id: Case
                employee_question: Question
                assistant_response: Assistant response
                cited_source: Cited source
                baseline_total: "Baseline score (of 4)"
                current_total: "Current score (of 4)"

  - id: causes
    title: Rule Out Causes
    type: steps
    steps:
      - title: Check whether the company policy changed
        text: |
          When an AI tool's answers get worse, there are four usual reasons:

          - **The inputs changed:** the documents the AI reads from changed.
          - **The AI model changed:** the company that makes the AI's "brain" swapped or updated it.
          - **The company policy changed:** the real rules changed, so the old answers are now out of date.
          - **The prompt changed:** someone changed the instructions given to the AI.

          You check each one against the evidence, and do not just guess. Start with the company policy. If it had changed, the answers would look worse because the rules moved, not because PolicyPal broke.

          Below are the date and `Cited source` of each answer. Each source name includes the date its policy started. Compare the sources before your drop date with the sources after it, and choose what you found.
        fields:
          - id: r_policy
            kind: select
            label: "Changed company policy"
            options:
              - "Ruled out: the cited policies and their effective dates are the same before and after the drop"
              - "Not ruled out: the cited policies or their effective dates changed around the date of the drop"
        answer: "Ruled out. The sources and their start dates are the same before and after 2026-08-12."
        show:
          - answers: [change_date]
          - table: {source: sample.csv, tools: false, hide: [employee_question, assistant_response, baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4, baseline_bqs, current_score_c1, current_score_c2, current_score_c3, current_score_c4], labels: {case_id: Case, cited_source: Cited source}}

      - title: Check whether the prompt changed
        text: |
          The prompt is the set of instructions PolicyPal is given. You cannot see the prompt itself, but the platform gives PolicyPal a new version number every time someone changes its instructions and publishes them.

          Do not judge this from the answers. Wordier answers could come from a new prompt or from a new model, so the answers cannot tell you which one it was.

          Below is the platform's activity log, in date order, showing the `AgentVersion` column. Is the version number the same before and after your drop date? Choose what you found.

          Not every platform shows an agent version. If yours does not, ask whoever manages the assistant for the dates its instructions were changed.
        fields:
          - id: r_prompt
            kind: select
            label: "Modified prompt"
            options:
              - "Ruled out: AgentVersion is the same before and after the drop, so PolicyPal's instructions were not changed"
              - "Not ruled out: AgentVersion changed around the date of the drop"
        answer: "Ruled out. `AgentVersion` is `1.4` on every row, before and after the drop. Nobody published new instructions."
        show:
          - answers: [change_date]
          - table: {source: activity-log.csv, tools: false, hide: [UserId, Operation, AppHost, AppIdentity, AgentName, AccessedResources, SensitivityLabelId, XPIADetected, AISystemPlugin, ModelProviderName, ModelName, ModelVersion, MessageId, IsPrompt]}

      - title: Check whether the inputs changed
        text: |
          The inputs are the documents PolicyPal reads to find its answers. If those changed, the answers would change too. The activity log records which documents PolicyPal actually read each time.

          Below is the activity log again, showing the `AccessedResources` column. Does PolicyPal read the same set of documents before and after your drop date? Choose what you found.
        fields:
          - id: r_inputs
            kind: select
            label: "Changed inputs"
            options:
              - "Ruled out: AccessedResources lists the same documents before and after the drop"
              - "Not ruled out: the documents in AccessedResources changed around the date of the drop"
        answer: "Ruled out. Before and after the drop, PolicyPal reads the same five documents: `PTO Policy 2025`, `Expense & Travel Policy 2025`, `Benefits Guide 2025`, `Code of Conduct 2025`, and `Remote Work Policy 2024`."
        show:
          - answers: [change_date]
          - table: {source: activity-log.csv, tools: false, hide: [UserId, Operation, AppHost, AppIdentity, AgentName, AgentVersion, SensitivityLabelId, XPIADetected, AISystemPlugin, ModelProviderName, ModelName, ModelVersion, MessageId, IsPrompt]}

  - id: model
    title: The Model
    type: steps
    steps:
      - title: Find the date the AI model changed
        text: |
          Three of the four causes are ruled out. The last one is the AI model. The activity log also records which AI model was running each time PolicyPal was used, in three columns: `ModelProviderName`, `ModelName`, and `ModelVersion`.

          Below is the activity log in date order, showing those columns. Read down `ModelName` and `ModelVersion` together, find where they change, and write what changed and on what date.

          Real logs do not always show all three columns. It depends on the platform and how it is set up. The company name is the one you can most often see, and the version number is the one you see least. The method is the same.
        fields:
          - {id: m_change, kind: textarea, rows: 2, label: "What changed in the model fields, and on what date?"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "`ModelName` changes from ______ to ______ and `ModelVersion` from ______ to ______, on ______."'
        answer: "Both change on the same day. `ModelName` changes from `gpt-4o` to `gpt-55-high`, and `ModelVersion` changes from `2024-11-20` to `2025-06-15`, on `2026-08-11`. The company name stays `OpenAI`, so this is a new version from the same company, not a switch to a different company."
        show:
          - table: {source: activity-log.csv, tools: false, hide: [UserId, Operation, AppHost, AppIdentity, AgentName, AgentVersion, AccessedResources, SensitivityLabelId, XPIADetected, AISystemPlugin, MessageId, IsPrompt]}

      - title: Write down the cause and the proof
        text: |
          Cause and effect need to be close together in time. Compare the date the model changed with the date the marks dropped. Both of your answers are below.

          Then write one sentence that names the cause and gives the proof: the tab, the column, and the values. A cause without proof is only a guess, and someone who was not here needs to be able to check what you say.
        fields:
          - {id: cause, kind: textarea, rows: 3, label: "State the cause in one sentence and cite the specific evidence (tab, column, values)."}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "Cause: ______. Evidence: in the ______, ______ changes from ______ to ______ on ______, ______ before the Business Quality Score drop."'
          - title: "Hint 2: an example answer"
            text: '"Cause: vendor model update on 2026-08-11. Evidence: in the Activity Log, ModelName changes from gpt-4o to gpt-55-high and ModelVersion from 2024-11-20 to 2025-06-15 on that date, one day before the Business Quality Score drop."'
        answer: "The model changed on 2026-08-11 and the marks dropped on 2026-08-12, one day apart. The cause is the vendor model update."
        show:
          - answers: [change_date, m_change]

  - id: record
    title: Test Record
    type: steps
    steps:
      - title: Say what you tested, when, and against what
        text: |
          A test record is a short written report of a check. Anyone reading it later should be able to see what you tested, when, and against what rules.

          The facts you need are below. Fill in all three boxes. For **When**, use today's date.
        fields:
          - {id: tr_what, kind: textarea, rows: 2, label: "The workflow, and the baseline case set: ID range and count"}
          - {id: tr_when, kind: text, label: "The date this test was run"}
          - {id: tr_standard, kind: text, label: "The quality standard name"}
        hints:
          - title: "Hint 1: sentences to start from"
            text: |
              - What was tested: "The ______ workflow, using the ______-response baseline set, cases ______ to ______."
              - When: today's date.
              - Against what standard: the name of the standard.
          - title: "Hint 2: example answers"
            text: |
              - What was tested: "The PolicyPal workflow, using the 20-response baseline set, cases L22-01 to L22-20."
              - Against what standard: "The PolicyPal Business Quality Standard."
        show:
          - markdown: |
              | What was checked | |
              |---|---|
              | Workflow | PolicyPal |
              | Cases | `L22-01` to `L22-20` (20 responses) |
              | Standard the answers were marked against | The PolicyPal Business Quality Standard |

      - title: Say how you did the check
        text: |
          Someone reading your record needs to know what you did, so they can trust the result or repeat it.

          Write one or two sentences saying what you compared and where you looked. What you found for each cause is below.
        fields:
          - {id: tr_method, kind: textarea, rows: 3, label: "How the test was run and what was checked"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "Compared the ______ scores with the ______ scores, then tested the ______ causes against the ______."'
          - title: "Hint 2: an example answer"
            text: "\"Compared current scores with baseline scores in the scored sample. Tested the four causes: policy against the cited sources' effective dates, and prompt, inputs and model against the AgentVersion, AccessedResources and model columns of the activity log.\""
        show:
          - answers: [r_policy, r_prompt, r_inputs, m_change]

      - title: Say what the numbers were
        text: |
          The result is the plain facts, without opinion yet.

          Write the score against the baseline, how many answers scored below their own baseline, and which rule (criterion) moved most. All of it is in the score box below. Open **How each criterion moved** to see which rule moved most.
        fields:
          - {id: tr_result, kind: textarea, rows: 3, label: "Current score against baseline, how many responses scored below their own baseline, and the criterion that moved most"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "The Business Quality Score fell from ______ to ______; ______ of 20 responses scored below their own baseline; ______ was the criterion most affected."'
          - title: "Hint 2: an example answer"
            text: '"The Business Quality Score fell from 90 to 69; 10 of 20 responses scored below their own baseline; c3 was the criterion most affected."'
        show:
          - table: *card

      - title: Say what you decided, and why
        text: |
          The conclusion answers "so what happened?". It is the part a busy person reads first.

          Say whether quality got worse. If it did, say what caused it and what proof you are pointing to. Your cause sentence from Step 7 is below.
        fields:
          - {id: tr_conclusion, kind: textarea, rows: 3, label: "Degraded or not degraded. If degraded: the cause and the evidence you cite for it"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "Degradation ______. The cause is ______ on ______. Evidence: ______."'
          - title: "Hint 2: an example answer"
            text: '"Degradation confirmed. The cause is a vendor model update on 2026-08-11. Evidence: the model name and version change in the Activity Log on that date, one day before the drop."'
        show:
          - answers: [cause]

  - id: answer
    title: My Answer
    type: report
    heading: Quality Test Record
    intro: "A third party should be able to read this record cold and know what was tested, how, and what you concluded. It is the kind of record that goes in an evidence packet (Module 5) and is attached to an escalation (Module 4). To keep a copy, click Save as PDF."
    sections:
      - {title: "What was tested", fields: [tr_what]}
      - {title: "When", fields: [tr_when]}
      - {title: "Against what standard", fields: [tr_standard]}
      - {title: "Method", fields: [tr_method]}
      - {title: "Confirm the drop", fields: [change_date]}
      - {title: "Three causes ruled out", fields: [r_policy, r_prompt, r_inputs]}
      - {title: "The vendor model update", fields: [m_change, cause]}
      - {title: "Result", fields: [tr_result]}
      - {title: "Conclusion", fields: [tr_conclusion]}

