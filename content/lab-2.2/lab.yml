title: Diagnose the Degradation and Document the Test
tabs:
  - id: sample
    title: The Drop
    type: steps
    steps:
      - title: Is this drop big enough to investigate?
        text: |
          It is a month later, and time for PolicyPal's next monthly review. After Lab 2.1, the platform team moved PolicyPal back to the AI model it used before.

          A colleague has already marked 20 of PolicyPal's answers from 26 August to 18 September against the Quality Standard, the same way you marked answers in Lab 2.1. The score box below adds up their marks. The score has dropped again.

          Your job in this lab is to find out why, and to write it down so someone else can act on it. The cause decides who you tell, and sending a problem to the wrong person means nobody fixes it. So do not assume it is the same cause as last month.

          First, decide whether the drop is big enough that the company's own rules say you must investigate. The alarm level (section 8 of the Quality Standard) is below the score box.
        fields:
          - {id: alarm_met, kind: select, label: "Has the score reached the alarm level?", options: ["Yes", "No"]}
        answer: "`Yes`. The score of 90 is still above the floor of 85, but it has dropped 6 points from the baseline of 96, which is more than the limit of 5. Crossing either line is enough, so you must investigate."
        show:
          - table: &card
              id: sample
              source: sample.csv
              view: scorecard
              scorecard:
                baseline_bqs: baseline_bqs
                criteria:
                  - {label: "c1 Current, named source", current: current_score_c1, baseline: baseline_score_c1}
                  - {label: "c2 Exact figure or entitlement", current: current_score_c2, baseline: baseline_score_c2}
                  - {label: "c3 Answers the question asked", current: current_score_c3, baseline: baseline_score_c3}
                  - {label: "c4 Human referral where required", current: current_score_c4, baseline: baseline_score_c4}
          - doc: quality-standard.md
            section: "8. Quality alarm level"

      - title: When did it start, and which answers dropped?
        text: |
          Below are the 20 marked answers in date order. Each has a mark at baseline and a mark now, out of 4.

          1. Find the first date on which an answer's mark now is lower than its mark at baseline.
          2. Look at the questions of the answers that dropped. Are they all kinds of question, or one kind?
        fields:
          - {id: change_date, kind: text, label: "Date the quality drop begins"}
          - {id: drop_pattern, kind: select, label: "Which answers dropped?", options: ["All kinds of questions", "Only questions about paid time off (PTO)", "Only questions about expenses", "Only questions about benefits"]}
        hints:
          - title: "Hint: where to look"
            text: "Compare the two mark columns row by row. For every row where the mark now is lower, read its question."
        answer: |
          - The drop begins on `2026-09-02`.
          - `Only questions about paid time off (PTO)`. The five answers that dropped (`L22-09`, `L22-11`, `L22-13`, `L22-17`, `L22-19`) are all about PTO. Expense and benefits answers from the same weeks kept their marks.
        show:
          - table:
              source: sample.csv
              tools: false
              computed:
                - {name: baseline_total, sum: [baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4]}
                - {name: current_total, sum: [current_score_c1, current_score_c2, current_score_c3, current_score_c4]}
              hide: [assistant_response, cited_source, baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4, baseline_bqs, current_score_c1, current_score_c2, current_score_c3, current_score_c4]
              fit: true
              labels: {case_id: Case, date: Date, employee_question: Question, baseline_total: "Mark at baseline (of 4)", current_total: "Mark now (of 4)"}

  - id: causes
    title: Check the Causes
    type: steps
    steps:
      - title: Check the AI model first
        text: |
          When an AI tool's answers get worse, there are four usual reasons:

          - **The AI model changed:** the company that makes the AI's "brain" swapped or updated it.
          - **The prompt changed:** someone changed the instructions given to the AI.
          - **The inputs changed:** the documents the AI reads from changed.
          - **The company policy changed:** the real rules changed, so the answers change with them.

          Last month the cause was a model change, so that is the first thing most people check. Below is the activity log, showing which AI model was running each time PolicyPal was used, and your drop date.

          Did the model change? If it did, does the timing fit the drop?
        fields:
          - id: r_model
            kind: select
            label: "The AI model"
            options:
              - "Ruled out: the model did not change"
              - "Ruled out: the model changed, but the timing does not fit the drop"
              - "Not ruled out: the model changed just before the drop"
        answer: "`Ruled out: the model changed, but the timing does not fit the drop`. The model did change on 2026-08-25, from `gpt-55-high` back to `gpt-4o`, the model PolicyPal used before Lab 2.1. But the answers kept their marks for a whole week after that, and the drop only starts on 2026-09-02. If the model were the cause, the drop would start straight after the change."
        show:
          - answers: [change_date]
          - table: {source: activity-log.csv, tools: false, hide: [UserId, Operation, AppHost, AppIdentity, AgentName, AgentVersion, AccessedResources, SensitivityLabelId, XPIADetected, AISystemPlugin, MessageId, IsPrompt]}

      - title: Check whether the prompt changed
        text: |
          The prompt is the set of instructions PolicyPal is given. You cannot see the prompt itself, but the platform gives PolicyPal a new version number, `AgentVersion`, every time someone changes its instructions and publishes them.

          Below is the activity log again, showing `AgentVersion`. Is it the same before and after your drop date?
        fields:
          - id: r_prompt
            kind: select
            label: "The prompt"
            options:
              - "Ruled out: AgentVersion is the same before and after the drop"
              - "Not ruled out: AgentVersion changed around the date of the drop"
        answer: "`Ruled out`. `AgentVersion` is `1.4` on every row. Nobody published new instructions."
        show:
          - answers: [change_date]
          - table: {source: activity-log.csv, tools: false, hide: [UserId, Operation, AppHost, AppIdentity, AgentName, AccessedResources, SensitivityLabelId, XPIADetected, AISystemPlugin, ModelProviderName, ModelName, ModelVersion, MessageId, IsPrompt]}

      - title: Check the documents and the policy
        text: |
          The last two causes are close cousins, and you tell them apart like this:

          - **The inputs changed** if the documents PolicyPal reads changed but the real rules did not. For example, someone uploaded a draft by mistake.
          - **The company policy changed** if the rules themselves changed, and PolicyPal is now reading and quoting the new, official policy.

          Below are two tables. The first shows which documents PolicyPal read each time (`AccessedResources`). The second shows the policy each answer cites, with its effective date. Look at what appears around your drop date, and choose what you found.
        fields:
          - id: r_policy
            kind: select
            label: "The documents and the policy"
            options:
              - "Neither changed: the same documents are read and cited throughout"
              - "The inputs changed: a draft or wrong document was added"
              - "The company policy changed: a new, official policy took effect"
        answer: "`The company policy changed`. From 2026-09-02, PTO questions read `PTO Policy 2026.docx` instead of the 2025 version, and the answers cite `PTO Policy 2026 (effective 2026-09-01)`. It is a named policy with an official start date, one day before the drop, so the rules really changed."
        show:
          - answers: [change_date]
          - markdown: "#### Documents PolicyPal read"
          - table: {source: activity-log.csv, tools: false, hide: [UserId, Operation, AppHost, AppIdentity, AgentName, AgentVersion, SensitivityLabelId, XPIADetected, AISystemPlugin, ModelProviderName, ModelName, ModelVersion, MessageId, IsPrompt]}
          - markdown: "#### The policy each answer cites"
          - table: {source: sample.csv, tools: false, hide: [employee_question, assistant_response, baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4, baseline_bqs, current_score_c1, current_score_c2, current_score_c3, current_score_c4], labels: {case_id: Case, date: Date, cited_source: Cited source}}

      - title: Are the new answers actually wrong?
        text: |
          The five answers that dropped all lost their mark on c2, the rule that every figure must match the reference figures in the Quality Standard.

          Below are those five answers, and the reference figures (section 9 of the Quality Standard) they were marked against. Compare the figures in the answers with the figures in the standard, and with the policy each answer cites.

          Is PolicyPal wrong, or is something else out of date?
        fields:
          - id: answers_wrong
            kind: select
            label: "Are the new PTO answers wrong?"
            options:
              - "Yes: PolicyPal should still give the 2025 figures"
              - "No: PolicyPal is quoting the new policy correctly; the Quality Standard's figures are out of date"
        answer: "`No`. PolicyPal gives the figures from `PTO Policy 2026`, which is now the official policy. The answers were marked down only because the reference figures in the Quality Standard still list the 2025 figures (15 days a year, a carryover cap of 5, 5 bereavement days, two weeks' notice). The yardstick is out of date, not the tool."
        show:
          - table: {source: sample.csv, tools: false, where: {case_id: [L22-09, L22-11, L22-13, L22-17, L22-19]}, hide: [baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4, baseline_bqs, current_score_c1, current_score_c2, current_score_c3, current_score_c4], labels: {case_id: Case, date: Date, employee_question: Question, assistant_response: Assistant response, cited_source: Cited source}}
          - doc: quality-standard.md
            section: "9. Reference figures from current policy"

  - id: conclusion
    title: Conclusion
    type: steps
    steps:
      - title: Write the conclusion
        text: |
          The conclusion is the part of the test record a busy person reads first. It answers "so what happened?".

          In two or three sentences, say what caused the drop, the evidence for it, and whether PolicyPal itself is at fault. What you found in the earlier steps is below.
        fields:
          - {id: tr_conclusion, kind: textarea, rows: 4, label: "What caused the drop, the evidence, and whether PolicyPal is at fault"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "The drop in PTO answers from ______ is caused by ______, which took effect on ______. Evidence: ______. PolicyPal is ______; the ______ in the Quality Standard are out of date."'
          - title: "Hint 2: an example answer"
            text: '"The drop in PTO answers from 2026-09-02 is caused by a company policy change: PTO Policy 2026 took effect on 2026-09-01. Evidence: from that date PolicyPal reads and cites PTO Policy 2026, and only PTO answers dropped, all on the exact-figure rule. The model change on 2026-08-25 came a week too early, and the prompt did not change. PolicyPal is quoting the new policy correctly; the reference figures in the Quality Standard are out of date."'
        show:
          - answers: [change_date, drop_pattern, r_model, r_prompt, r_policy, answers_wrong]

      - title: Decide who to speak to
        text: |
          Send a finding to whoever can change the thing that is out of date. Your conclusion is below.

          Choose who you would speak to, then write one line saying why.
        fields:
          - id: handoff
            kind: select
            label: "Who do you speak to, and what happens next?"
            options:
              - "The platform / technical owner, to change the model again"
              - "The team that owns the HR policy library, to confirm PTO Policy 2026 is the official policy; then I update the Quality Standard's figures and re-set the baseline"
              - "The HR operations reviewers, to mark the answers again"
              - "No one: PolicyPal is right, so there is nothing to do"
          - {id: handoff_why, kind: text, label: "Why? One line."}
        answer: "`The team that owns the HR policy library`, then you update the standard. The policy changed, so the owners of the policy confirm it is official, and you, as the Business AI Owner, update the reference figures in the Quality Standard and re-set the baseline. The platform team cannot help: nothing is wrong with the model. Doing nothing is also wrong, because every future review would keep raising the same false alarm."
        show:
          - answers: [tr_conclusion]

  - id: answer
    title: My Answer
    type: report
    heading: Quality Test Record
    intro: "What was tested: the PolicyPal workflow, 20 answers from 2026-08-26 to 2026-09-18 (cases L22-01 to L22-20), marked against the PolicyPal Business Quality Standard. A third party should be able to read this record cold and know what was found and what happens next. To keep a copy, click Save as PDF."
    sections:
      - {title: "Is an investigation needed?", fields: [alarm_met]}
      - {title: "The drop", fields: [change_date, drop_pattern]}
      - {title: "The four causes checked", fields: [r_model, r_prompt, r_policy]}
      - {title: "Are the answers wrong?", fields: [answers_wrong]}
      - {title: "Conclusion", fields: [tr_conclusion]}
      - {title: "Next step", fields: [handoff, handoff_why]}

