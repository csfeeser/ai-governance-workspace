title: Assemble the AI Evidence Packet
tabs:
  - id: folder
    title: The Folder
    type: steps
    steps:
      - title: Sort the papers into the packet
        text: |
          Today is Monday 2026-09-28. The company's internal audit team is checking how its AI tools are looked after, and has asked for PolicyPal's evidence packet for Q2 2026 (2026-04-01 to 2026-06-30). An auditor is a person whose job is to check that a company really did what it says it did. "We looked after it" is not proof. Papers are.

          You took over PolicyPal in July (Lab 1.1), so Q2 was before your time. The previous owner's papers have been exported from their shared drive into one folder of eight papers. They are below, after the six sections of the packet.

          A paper goes in the packet only if both of these are true:

          - it is about PolicyPal
          - it is evidence for Q2: it was made during Q2, or it was in force during Q2

          For each paper, choose the section it goes in, or **Leave it out**.
        fields:
          - {id: p-a1, kind: select, label: "a1-business-purpose", options: &secs ["1. Business purpose statement", "2. System instructions and baseline business rules", "3. Sampled review records and quality scores", "4. HITL override summary and reviewer quality audit", "5. Incident and escalation history", "6. Change-control and approval log", "Leave it out"]}
          - {id: p-a2, kind: select, label: "a2-system-instructions-v3", options: *secs}
          - {id: p-a3, kind: select, label: "a3-system-instructions-v2", options: *secs}
          - {id: p-a4, kind: select, label: "a4-review-sample-q2", options: *secs}
          - {id: p-a5, kind: select, label: "a5-hitl-override-summary-q2", options: *secs}
          - {id: p-a6, kind: select, label: "a6-remediation-plan-RA", options: *secs}
          - {id: p-a7, kind: select, label: "a7-incident-history", options: *secs}
          - {id: p-a8, kind: select, label: "a8-finance-assistant-sample-q2", options: *secs}
        hints:
          - title: "Hint 1: where to look"
            text: |
              The top of each paper gives its workflow and its dates: look for **Workflow**, and for **Effective**, **Period** or **Plan date**. The two tables give theirs in the **workflow**, **quarter** and **retest_date** columns. For every paper, check whose it is, and whether its dates fall in 2026-04-01 to 2026-06-30. A paper that took effect after that did not govern PolicyPal in Q2, however new it is. One section takes two papers.
        answer: |
          - `a1-business-purpose`: section 1.
          - `a2-system-instructions-v3`: leave it out. It took effect on 2026-07-13, after the quarter ended, so it is not what PolicyPal was told to do in Q2. It will belong in the Q3 packet.
          - `a3-system-instructions-v2`: section 2. It was in force for the whole of Q2. It is superseded now, but an auditor asks what PolicyPal was told to do during the period, not today.
          - `a4-review-sample-q2`: section 3.
          - `a5-hitl-override-summary-q2` and `a6-remediation-plan-RA`: both section 4. One is the summary of the human checking, the other the plan to fix a reviewer who was not checking.
          - `a7-incident-history`: section 5.
          - `a8-finance-assistant-sample-q2`: leave it out. Its `workflow` column says `FinanceAssistant`: it is another AI tool's quality record.
          - Nothing in the folder goes in section 6.
        show:
          - markdown: |
              #### The six sections of the packet

              | Section | The auditor's question |
              |---|---|
              | 1. Business purpose statement | What is this tool for? |
              | 2. System instructions and baseline business rules | What was it told to do? |
              | 3. Sampled review records and quality scores | Did you check its quality, and when? |
              | 4. HITL override summary and reviewer quality audit | Was the human checking real? (HITL means "human in the loop": a person checking the AI.) |
              | 5. Incident and escalation history | What went wrong, and what did you do about it? |
              | 6. Change-control and approval log | What changed, and who approved it? |
          - markdown: "#### Paper: a1-business-purpose"
          - doc: a1-business-purpose.md
          - markdown: "#### Paper: a2-system-instructions-v3"
          - doc: a2-system-instructions-v3.md
          - markdown: "#### Paper: a3-system-instructions-v2"
          - doc: a3-system-instructions-v2.md
          - markdown: "#### Paper: a4-review-sample-q2"
          - table: &a4 {source: a4-review-sample-q2.csv, tools: false, fit: true, labels: {workflow: Workflow, quarter: Quarter, standard_version: Scored against, retest_date: Re-test date, answers_scored: Answers scored, c1_met: c1 met, c2_met: c2 met, c3_met: c3 met, c4_met: c4 met, criteria_met: Criteria met, bqs: Score}}
          - markdown: "#### Paper: a5-hitl-override-summary-q2"
          - doc: a5-hitl-override-summary-q2.md
          - markdown: "#### Paper: a6-remediation-plan-RA"
          - doc: a6-remediation-plan-RA.md
          - markdown: "#### Paper: a7-incident-history"
          - doc: a7-incident-history.md
          - markdown: "#### Paper: a8-finance-assistant-sample-q2"
          - table: {<<: *a4, source: a8-finance-assistant-sample-q2.csv}

  - id: gaps
    title: Gaps
    type: steps
    steps:
      - title: Find the gaps
        text: |
          A packet with a missing paper is bad. A missing paper that nobody mentioned is worse, because the auditor will find it and ask why it was hidden. So a packet lists its own gaps.

          A gap is evidence the packet should hold for Q2 but does not. A problem that the evidence shows is not a gap: the auditor will see it on the paper and ask about it, and that is how it should be.

          The papers you put in the packet are below. Tick every gap.
        fields:
          - id: gaps-found
            kind: checklist
            label: "Known gaps"
            options:
              - "Section 6 is empty: nothing in the folder records what changed in PolicyPal in Q2, or who approved it"
              - "Section 4 is short: the reviewer summary covers 2026-05-19 to 2026-06-17, not the whole of Q2"
              - "Section 2 is out of date: v2 has since been replaced by v3, so the rules on file are not current"
              - "Section 3 used the wrong yardstick: Q2 was scored with the previous owner's checklist, not today's standard"
              - "Section 4 is unfinished: the plan for R-A has no result, because its re-check date is 2026-07-18"
              - "Section 5 is incomplete: six issues raised in June were never routed to anyone before the quarter ended"
        hints:
          - title: "Hint 1: where to look"
            text: |
              For each option, ask two questions. Is the thing it describes inside Q2 (2026-04-01 to 2026-06-30)? And is evidence missing, or is the evidence there and showing something that went wrong? Compare the **Period** line at the top of `a5` with the dates of Q2, and the **Re-check date** in `a6` with the end of Q2.
        answer: |
          Two gaps: section 6 is empty, and section 4's reviewer summary covers only 30 days of the quarter's 91.

          - Section 2: v2 is the right paper. It was in force in Q2, and the packet is about Q2.
          - Section 3: Q2 was scored against the checklist in force at the time. Re-scoring the past against today's standard would not show what the previous owner checked.
          - R-A's plan: the re-check on 2026-07-18 is after the quarter, so its result belongs in the Q3 packet.
          - The June issues: the incident history shows them. That is a real problem for the auditor to ask about, but the evidence is there, so it is not a gap.
        show:
          - markdown: |
              #### What is in your packet

              | Section | Paper |
              |---|---|
              | 1 | `a1-business-purpose` |
              | 2 | `a3-system-instructions-v2` (in force 2026-03-02 to 2026-07-12) |
              | 3 | `a4-review-sample-q2` |
              | 4 | `a5-hitl-override-summary-q2` and `a6-remediation-plan-RA` |
              | 5 | `a7-incident-history` |
              | 6 | Nothing |
          - markdown: "#### Paper: a4-review-sample-q2"
          - table: *a4
          - markdown: "#### Paper: a5-hitl-override-summary-q2"
          - doc: a5-hitl-override-summary-q2.md
          - markdown: "#### Paper: a6-remediation-plan-RA"
          - doc: a6-remediation-plan-RA.md
          - markdown: "#### Paper: a7-incident-history"
          - doc: a7-incident-history.md

      - title: Say who can supply the missing evidence
        text: |
          A gap on its own is only half the job. The packet also says who will produce the missing evidence, so it actually arrives. Ask whoever holds the records, not a department that would have to pass it on.

          For each gap, choose who can supply it. What changed in PolicyPal during Q2 is in the incident history below, and what each owner is responsible for is in the table.
        fields:
          - id: gap6-owner
            kind: select
            label: "Section 6: who can supply the record of what changed in Q2?"
            options: &gapowners
              - "The team responsible for the platform and the vendor relationship"
              - "The function that owns the PolicyPal system instructions"
              - "The team that owns the HR policy library"
              - "The function that runs the human review process for PolicyPal"
          - {id: gap4-owner, kind: select, label: "Section 4: who can supply the reviewer log for the rest of Q2?", options: *gapowners}
        hints:
          - title: "Hint 1: where to look"
            text: |
              In the incident history, find the June issue that describes something being changed in PolicyPal, and check who made that change. Then check whether PolicyPal's instructions changed in Q2: `v2` was in force from 2026-03-02 to 2026-07-12. For section 4, look at the owners table for who is responsible for the reviewer log.
        answer: |
          - Section 6: `The team responsible for the platform and the vendor relationship`. The only change recorded in Q2 is issue 5, the model version change made by IT in June. The instructions did not change in Q2 (v2 was in force all quarter), and the policy library and the reviewers are not changes to PolicyPal itself.
          - Section 4: `The function that runs the human review process for PolicyPal`. They run the reviewers and keep the reviewer log.
        show:
          - markdown: |
              #### Who is responsible for what

              | Owner | What they are responsible for |
              |---|---|
              | The team responsible for the platform and the vendor relationship | The AI tools' technology: the models, the software, speed and uptime, and the contracts with the AI vendors |
              | The function that owns the PolicyPal system instructions | Writing, approving and publishing PolicyPal's instructions (v2, v3) |
              | The team that owns the HR policy library | The HR policy documents PolicyPal reads from |
              | The function that runs the human review process for PolicyPal | The reviewers, how they review, and the reviewer log |
          - markdown: "#### Paper: a7-incident-history"
          - doc: a7-incident-history.md

  - id: storage
    title: Storage
    type: steps
    steps:
      - title: Say where the copies are kept
        text: |
          The papers only count as evidence if they still exist when someone asks for them. Choose where the exported copies of the packet's papers should be kept. The company's records rule, and what each place is, are below.
        fields:
          - id: keep-where
            kind: select
            label: "Where should the exported copies be kept?"
            options:
              - "GRC evidence library: the company's own records system, kept for as long as the company's rules require"
              - "Copilot audit log: where PolicyPal's activity was first recorded, so the copies sit with the originals"
              - "Purview audit: Microsoft's compliance search for Copilot, which auditors can search by date and user"
              - "Claude workspace: the other AI platform the company uses, so all AI evidence is kept in one place"
        hints:
          - title: "Hint 1: where to look"
            text: |
              Read the company's records rule first: how long must this evidence be kept? Then go down the **How long it keeps records** column and cross out every place that keeps records for less than that. Today's date and the start of Q2 tell you how old the oldest Q2 records already are.
        answer: "`GRC evidence library`. The records rule says three years, and it is the only place that keeps records for as long as the company decides. The other three are parts of the AI platforms, which keep about 180 days. Q2 began on 2026-04-01, about 180 days ago, so the platform's records from early April are already due to be deleted."
        show:
          - markdown: |
              #### The company's records rule

              Evidence that an AI tool was overseen is kept for three years after the end of the period it covers.

              #### Where records can be kept

              | Place | What it is | How long it keeps records |
              |---|---|---|
              | GRC evidence library | The company's governance, risk and compliance (GRC) records system | As long as the company's rules require |
              | Copilot audit log | The record Microsoft Copilot keeps of how PolicyPal was used | About 180 days |
              | Purview audit | Microsoft's compliance tool for searching that record | About 180 days |
              | Claude workspace | The workspace of the other AI platform the company uses | About 180 days |

  - id: answer
    title: My Packet
    type: report
    heading: AI Evidence Packet
    intro: "Workflow: PolicyPal. Coverage: 2026-Q2 (2026-04-01 to 2026-06-30). Prepared on 2026-09-28 by PolicyPal's Business AI Owner for the internal audit team. This is what \"we have oversight\" looks like when an auditor asks for proof. To keep a copy, click Save as PDF."
    sections:
      - {title: "Where each paper goes", fields: [p-a1, p-a2, p-a3, p-a4, p-a5, p-a6, p-a7, p-a8]}
      - {title: "Known gaps", fields: [gaps-found]}
      - {title: "Who will supply the missing evidence", fields: [gap6-owner, gap4-owner]}
      - {title: "Where the exported copies are kept", fields: [keep-where]}
