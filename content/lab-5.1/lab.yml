title: Assemble the AI Evidence Packet
tabs:
  - id: folder
    title: The Folder
    type: steps
    steps:
      - title: See what the auditor has asked for
        text: |
          Today is Monday 2026-09-28. The company's internal audit team is checking how its AI tools are looked after, and has asked for PolicyPal's evidence packet for Q2 2026 (2026-04-01 to 2026-06-30). An auditor is a person whose job is to check that a company really did what it says it did. "We looked after it" is not proof. Papers are.

          You took over PolicyPal in July (Lab 1.1), so Q2 was before your time. The previous owner's papers have been exported from their shared drive into one folder of eight papers. The packet has six sections, listed below, and each answers one question an auditor asks.

          A paper goes in the packet only if both of these are true:

          - it is about PolicyPal
          - it is evidence for Q2: it was made during Q2, or it was in force during Q2

          There is nothing to choose in this step. In the next eight steps you see one paper at a time, and choose its section right under it.
        hints:
          - title: "Hint 1: where to look"
            text: |
              The top of each paper gives its workflow and its dates: look for **Workflow**, and for **Effective**, **Period** or **Plan date**. The two tables give theirs in the **Workflow**, **Quarter** and **Re-test date** columns. For every paper, check whose it is, and whether its dates fall in 2026-04-01 to 2026-06-30. A paper that took effect after that did not govern PolicyPal in Q2, however new it is. One section takes two papers.
        show:
          - markdown: |
              #### The six sections of the packet

              | Section | The auditor's question |
              |---|---|
              | 1. Business purpose statement | What is this tool for? |
              | 2. System instructions and baseline business rules | What was it told to do? |
              | 3. Sampled review records and quality scores | Did you check its quality, and when? |
              | 4. HITL override summary and reviewer quality audit | Was the human checking real? (HITL means "human in the loop": a person checking the AI.) |
              | 5. Incident and escalation history | What went wrong, and what did you do about it? |
              | 6. Change-control and approval log | What changed, and who approved it? |

      - title: "Paper 1 of 8: a1-business-purpose"
        text: |
          The paper is above. Choose the section it goes in, or **Leave it out**.
        fields:
          - {id: p-a1, kind: select, label: "Where does a1-business-purpose go?", options: &secs ["1. Business purpose statement", "2. System instructions and baseline business rules", "3. Sampled review records and quality scores", "4. HITL override summary and reviewer quality audit", "5. Incident and escalation history", "6. Change-control and approval log", "Leave it out"]}
        answer: "`1. Business purpose statement`. It says what PolicyPal is for and who uses it, and it was in force all through Q2 (effective 2026-03-02, last reviewed 2026-06-05)."
        show_first: true
        show:
          - markdown: "#### Paper 1 of 8: a1-business-purpose"
          - doc: a1-business-purpose.md

      - title: "Paper 2 of 8: a2-system-instructions-v3"
        text: |
          The paper is above. Choose the section it goes in, or **Leave it out**.
        fields:
          - {id: p-a2, kind: select, label: "Where does a2-system-instructions-v3 go?", options: *secs}
        answer: "`Leave it out`. v3 took effect on 2026-07-13, after Q2 ended, so it is not what PolicyPal was told to do in Q2, even though it is the newest version. It will belong in the Q3 packet."
        show_first: true
        show:
          - markdown: "#### Paper 2 of 8: a2-system-instructions-v3"
          - doc: a2-system-instructions-v3.md

      - title: "Paper 3 of 8: a3-system-instructions-v2"
        text: |
          The paper is above. Choose the section it goes in, or **Leave it out**.
        fields:
          - {id: p-a3, kind: select, label: "Where does a3-system-instructions-v2 go?", options: *secs}
        answer: "`2. System instructions and baseline business rules`. v2 was in force from 2026-03-02 to 2026-07-12, the whole of Q2. It is superseded now, but the auditor asks what PolicyPal was told to do during Q2, not today."
        show_first: true
        show:
          - markdown: "#### Paper 3 of 8: a3-system-instructions-v2"
          - doc: a3-system-instructions-v2.md

      - title: "Paper 4 of 8: a4-review-sample-q2"
        text: |
          The paper is above. Choose the section it goes in, or **Leave it out**.
        fields:
          - {id: p-a4, kind: select, label: "Where does a4-review-sample-q2 go?", options: *secs}
        answer: "`3. Sampled review records and quality scores`. It is PolicyPal's (see the **Workflow** column), and it holds the three monthly re-tests from April, May and June."
        show_first: true
        show:
          - markdown: "#### Paper 4 of 8: a4-review-sample-q2"
          - table: &a4 {source: a4-review-sample-q2.csv, tools: false, fit: true, labels: {workflow: Workflow, quarter: Quarter, standard_version: Scored against, retest_date: Re-test date, answers_scored: Answers scored, c1_met: c1 met, c2_met: c2 met, c3_met: c3 met, c4_met: c4 met, criteria_met: Criteria met, bqs: Score}}

      - title: "Paper 5 of 8: a5-hitl-override-summary-q2"
        text: |
          The paper is above. Choose the section it goes in, or **Leave it out**.
        fields:
          - {id: p-a5, kind: select, label: "Where does a5-hitl-override-summary-q2 go?", options: *secs}
        answer: "`4. HITL override summary and reviewer quality audit`. It is PolicyPal's summary of how often the human reviewers disagreed with the AI, with a judgement of the reviewers, from inside Q2."
        show_first: true
        show:
          - markdown: "#### Paper 5 of 8: a5-hitl-override-summary-q2"
          - doc: a5-hitl-override-summary-q2.md

      - title: "Paper 6 of 8: a6-remediation-plan-RA"
        text: |
          The paper is above. Choose the section it goes in, or **Leave it out**.
        fields:
          - {id: p-a6, kind: select, label: "Where does a6-remediation-plan-RA go?", options: *secs}
        answer: "`4. HITL override summary and reviewer quality audit`. It is the plan to fix the reviewer problem that `a5` found, dated 2026-06-18, inside Q2. Section 4 holds both papers."
        show_first: true
        show:
          - markdown: "#### Paper 6 of 8: a6-remediation-plan-RA"
          - doc: a6-remediation-plan-RA.md

      - title: "Paper 7 of 8: a7-incident-history"
        text: |
          The paper is above. Choose the section it goes in, or **Leave it out**.
        fields:
          - {id: p-a7, kind: select, label: "Where does a7-incident-history go?", options: *secs}
        answer: "`5. Incident and escalation history`. It lists what went wrong in Q2 and what was done about it, including the June issues nobody picked up."
        show_first: true
        show:
          - markdown: "#### Paper 7 of 8: a7-incident-history"
          - doc: a7-incident-history.md

      - title: "Paper 8 of 8: a8-finance-assistant-sample-q2"
        text: |
          The paper is above. Choose the section it goes in, or **Leave it out**.
        fields:
          - {id: p-a8, kind: select, label: "Where does a8-finance-assistant-sample-q2 go?", options: *secs}
        answer: "`Leave it out`. Its **Workflow** column says `FinanceAssistant`: it is another AI tool's quality record, laid out like PolicyPal's."
        show_first: true
        show:
          - markdown: "#### Paper 8 of 8: a8-finance-assistant-sample-q2"
          - table: {<<: *a4, source: a8-finance-assistant-sample-q2.csv}

  - id: gaps
    title: Gaps
    type: steps
    steps:
      - title: "Gap 1: what is missing from section 6"
        text: |
          No paper in the folder went in section 6, which answers "What changed in PolicyPal, and who approved it?". That is a gap. A packet lists its own gaps, so the auditor hears about them from you instead of finding them.

          Above are the issues raised in June and who is responsible for what. Choose what the missing record should show, and who can supply it.
        fields:
          - id: gap6-what
            kind: select
            label: "What should section 6's missing record show?"
            options:
              - "IT's change to PolicyPal's AI model version in June (issue 5), and who approved it"
              - "The change from v2 to v3 of PolicyPal's rules, and who approved the new rules"
              - "The removal of PTO Policy 2023 from the HR Policy Library, and who approved it"
              - "The handover of PolicyPal from the previous owner to you, and who approved it"
          - id: gap6-owner
            kind: select
            label: "Who can supply that record?"
            options: &gapowners
              - "The team responsible for the platform and the vendor relationship"
              - "The function that owns the PolicyPal system instructions"
              - "The team that owns the HR policy library"
              - "The function that runs the human review process for PolicyPal"
        hints:
          - title: "Hint 1: where to look"
            text: |
              Section 6 is about changes made to PolicyPal itself during Q2 (2026-04-01 to 2026-06-30). Go down the **Problem** column for something that was changed, and check its **Raised** date. Then find who is responsible for that kind of thing in the second table.
        answer: |
          - `IT's change to PolicyPal's AI model version in June (issue 5)`. It is the one change to PolicyPal in Q2, and nobody was told about it.
            - v2 to v3 happened on 2026-07-13, after Q2.
            - PTO Policy 2023 was never removed, and the library is PolicyPal's reading material, not PolicyPal itself.
            - The handover was in July.
          - `The team responsible for the platform and the vendor relationship`. They run the AI models, so they hold the record of the change and of who approved it.
        show_first: true
        show:
          - markdown: "_Gap 1. Read the two tables below, then answer Step 10 underneath them._"
          - doc: a7-incident-history.md
            section: Issues logged in June but not routed
          - markdown: &owners |
              #### Who is responsible for what

              | Owner | What they are responsible for |
              |---|---|
              | The team responsible for the platform and the vendor relationship | The AI tools' technology: the models, the software, speed and uptime, and the contracts with the AI vendors |
              | The function that owns the PolicyPal system instructions | Writing, approving and publishing PolicyPal's instructions (v2, v3) |
              | The team that owns the HR policy library | The HR policy documents PolicyPal reads from |
              | The function that runs the human review process for PolicyPal | The reviewers, how they review, and the reviewer log |

      - title: "Gap 2: does section 4 cover the whole quarter?"
        text: |
          A section can have a paper and still be short, because the paper covers less time than the packet. The packet covers Q2: 2026-04-01 to 2026-06-30.

          Above is the reviewer summary you put in section 4. Decide whether it covers the whole quarter, and who can supply anything that is missing.
        fields:
          - id: gap4-cover
            kind: select
            label: "Does a5-hitl-override-summary-q2 cover the whole of Q2?"
            options:
              - "No: it covers only 2026-05-19 to 2026-06-17, so April, early May and late June are missing"
              - "Yes: its Period line says 2026-Q2, so it covers the quarter the auditor has asked about"
              - "Yes: its 212 decisions are far more than the 20 answers used in each monthly quality re-test"
              - "No: it leaves out reviewer R-A, whose decisions are covered by a separate remediation plan"
          - {id: gap4-owner, kind: select, label: "Who can supply the reviewer log for the rest of Q2?", options: *gapowners}
        hints:
          - title: "Hint 1: where to look"
            text: |
              Read the **Period** line at the top of the paper, including the dates in brackets, and compare them with 2026-04-01 to 2026-06-30. Then check the table for who keeps the reviewer log.
        answer: |
          - `No: it covers only 2026-05-19 to 2026-06-17`. Its Period line says 2026-Q2, but the dates in brackets are 30 days of a 91-day quarter. R-A is in the table like everyone else, and the number of decisions says nothing about which dates they cover.
          - `The function that runs the human review process for PolicyPal`. They run the reviewers and keep the reviewer log.
        show_first: true
        show:
          - markdown: "_Gap 2. Read the reviewer summary below, then answer Step 11 underneath it._"
          - doc: a5-hitl-override-summary-q2.md
          - markdown: *owners

  - id: storage
    title: Storage
    type: steps
    steps:
      - title: Say where the copies are kept
        text: |
          The papers only count as evidence if they still exist when someone asks for them. Choose where the exported copies of the packet's papers should be kept. The company's records rule, and what each place is, are below.
        fields:
          - id: keep-where
            kind: select
            label: "Where should the exported copies be kept?"
            options:
              - "GRC evidence library: the company's own records system, kept for as long as the company's rules require"
              - "Copilot audit log: where PolicyPal's activity was first recorded, so the copies sit with the originals"
              - "Purview audit: Microsoft's compliance search for Copilot, which auditors can search by date and user"
              - "Claude workspace: the other AI platform the company uses, so all AI evidence is kept in one place"
        hints:
          - title: "Hint 1: where to look"
            text: |
              Read the company's records rule first: how long must this evidence be kept? Then go down the **How long it keeps records** column and cross out every place that keeps records for less than that. Today's date and the start of Q2 tell you how old the oldest Q2 records already are.
        answer: "`GRC evidence library`. The records rule says three years, and it is the only place that keeps records for as long as the company decides. The other three are parts of the AI platforms, which keep about 180 days. Q2 began on 2026-04-01, about 180 days ago, so the platform's records from early April are already due to be deleted."
        show:
          - markdown: |
              #### The company's records rule

              Evidence that an AI tool was overseen is kept for three years after the end of the period it covers.

              #### Where records can be kept

              | Place | What it is | How long it keeps records |
              |---|---|---|
              | GRC evidence library | The company's governance, risk and compliance (GRC) records system | As long as the company's rules require |
              | Copilot audit log | The record Microsoft Copilot keeps of how PolicyPal was used | About 180 days |
              | Purview audit | Microsoft's compliance tool for searching that record | About 180 days |
              | Claude workspace | The workspace of the other AI platform the company uses | About 180 days |

  - id: answer
    title: My Packet
    type: report
    heading: AI Evidence Packet
    intro: "Workflow: PolicyPal. Coverage: 2026-Q2 (2026-04-01 to 2026-06-30). Prepared on 2026-09-28 by PolicyPal's Business AI Owner for the internal audit team. This is what \"we have oversight\" looks like when an auditor asks for proof. To keep a copy, click Save as PDF."
    sections:
      - {title: "Where each paper goes", fields: [p-a1, p-a2, p-a3, p-a4, p-a5, p-a6, p-a7, p-a8]}
      - {title: "Known gap 1: section 6", fields: [gap6-what, gap6-owner]}
      - {title: "Known gap 2: section 4", fields: [gap4-cover, gap4-owner]}
      - {title: "Where the exported copies are kept", fields: [keep-where]}
