title: Set the Business Quality Standard for a Deployed AI Workflow
tabs:
  - id: intake
    title: Intake Record
    type: doc
    source: intake-record.md
  - id: issues
    title: Open Issues
    type: table
    source: open-issues.csv
    note: "Fill in the Owner column for all eight issues."
    editable:
      - column: owner
        options: ["Business AI Owner", "Platform / technical owner"]
  - id: cadence
    title: Review Cadence
    type: doc
    source: review-cadence.md
  - id: answer
    title: My Answer
    type: form
    heading: Business Quality Standard
    intro: "Fill in every section. Keep entries short and checkable: a colleague should be able to apply this standard tomorrow without asking you a question."
    sections:
      - title: "1. Workflow and purpose"
        fields:
          - {id: purpose, kind: textarea, rows: 2, label: "One sentence: what this workflow does and for whom.", example: "PolicyPal answers employee questions about company HR policy (PTO, benefits, expense, travel, conduct), grounded on the HR Policy Library."}
      - title: "2. Risk tier, review cadence, and sample size"
        help: "Read these from the Intake Record and Review Cadence tabs. You read these; you do not set them."
        fields:
          - {id: tier, kind: text, label: "Risk tier"}
          - {id: cadence, kind: text, label: "Review cadence"}
          - {id: sample, kind: text, label: "Baseline sample size"}
      - title: "2b. Justify the two borderline issues"
        help: "Pick the two issues on the Open Issues tab where the owner was not obvious. In one line each, say what makes your assignment correct."
        fields:
          - {id: just1, kind: textarea, rows: 2, label: "Borderline issue 1 (number and justification)"}
          - {id: just2, kind: textarea, rows: 2, label: "Borderline issue 2 (number and justification)"}
      - title: "3. What a correct answer looks like"
        help: "Two criteria a reviewer could mark yes or no."
        fields:
          - {id: correct-1, kind: text, label: "A criterion that would have caught Issue 1 (an old policy version cited)"}
          - {id: correct-2, kind: text, label: "A criterion that would have caught Issue 3 (two employees given different figures)"}
      - title: "4. Business rules that must always hold"
        help: "Two rules the assistant must never break, phrased as absolutes."
        fields:
          - {id: rules-1, kind: text, label: "A rule that would have prevented Issue 3 (different per-diem figures)"}
          - {id: rules-2, kind: text, label: "A rule that would have prevented Issue 7 (legal detail about maternity leave)"}
      - title: "5. Errors that are unacceptable"
        help: "Two failures that are never tolerable, no matter how rare."
        fields:
          - {id: errors-1, kind: text, label: "An unacceptable error shown by Issue 1 (an old policy version cited)"}
          - {id: errors-2, kind: text, label: "An unacceptable error shown by Issue 7 (legal detail about maternity leave)"}
      - title: "6. When a human must intervene"
        help: "Two situations where the assistant should stop and route the employee to a person."
        fields:
          - {id: triggers-1, kind: text, label: "A trigger that would have caught Issue 2 (accommodation or protected-leave questions)"}
          - {id: triggers-2, kind: text, label: "A trigger for the situation behind Issue 1 (two versions of one policy in the library)"}
      - title: "7. Tolerable inconsistency"
        help: "One threshold, in plain language or as a percentage."
        fields:
          - {id: tolerance, kind: textarea, rows: 2, label: "How much difference is acceptable between two answers to the same question? (Issue 3)"}
