title: The Remediation Plan
tabs:
  - id: finding
    title: The Finding
    type: steps
    steps:
      - title: Choose how to state the finding
        text: |
          In Lab 3.1 you found that reviewer R-A almost never disagrees with PolicyPal, and you decided the fix belongs to the function that runs the human review process. Now you write the plan for fixing it, called a remediation plan ("remediate" means "fix").

          The plan goes to the manager who runs the review process and into PolicyPal's records, and it is one of the six papers an auditor checks in Module 5. An auditor is a person whose job is to check a company's proof. A plan only counts if someone reading it a month from now can say plainly whether the fix worked.

          Below is the written finding about R-A. Read it. Then choose the statement that should open the plan. A good finding:

          - describes a gap in how the work is done, not a fault in a person
          - includes the numbers, so it can be checked
        fields:
          - id: finding_stmt
            kind: select
            label: "Which statement should open the plan?"
            options:
              - "R-A is not doing their job properly and should be replaced."
              - "Approvals from reviewer R-A are not getting an independent check: R-A's override rate is 2% against a team average of 18%, near zero in every week and case type."
              - "PolicyPal's proposals are approved too often."
              - "R-A needs to be more careful when reviewing cases."
        answer: "The second one: `Approvals from reviewer R-A are not getting an independent check...`. It names the gap in the process (approvals without an independent check) and gives the numbers. The first blames a person, which is neither fair nor fixable in a plan. The third points at the AI, which Lab 3.1 ruled out. The fourth is a wish with no numbers, so no one could check it later."
        show:
          - doc: finding.md

  - id: plan
    title: The Plan
    type: steps
    steps:
      - title: Choose what to do about it
        text: |
          The first thing the plan does is check that the worry is real: a second reviewer re-marks a sample of R-A's recent approvals. If the pattern holds, one corrective action follows.

          The table below says what each possible action changes, and which kind of problem it fixes. Your finding is about approvals that are not getting an independent check. Choose the action that fixes that.
        fields:
          - id: action
            kind: select
            label: "Corrective action"
            options:
              - "Targeted re-training on the review standard"
              - "Ongoing second-review sampling"
              - "Workload rebalancing"
              - "Reassignment"
        answer: "`Ongoing second-review sampling`. It puts an independent check back on R-A's approvals, and on every reviewer's, for as long as it runs. Re-training helps if R-A does not understand the standard, but it does not add a check. Rebalancing and reassignment treat it as a workload or a person problem, and the gap would stay. (A real plan often pairs sampling with re-training.)"
        show:
          - markdown: |
              | Action | What it changes | The problem it fixes |
              |---|---|---|
              | Targeted re-training on the review standard | The reviewer is taught the standard again | A reviewer who does not understand the rules |
              | Ongoing second-review sampling | A second reviewer re-checks a sample of every reviewer's decisions, every month | Decisions that nobody independently checks |
              | Workload rebalancing | Fewer cases per reviewer | A reviewer rushing because they have too many cases |
              | Reassignment | The reviewer moves to other work | A reviewer who should not be reviewing at all |
          - answers: [finding_stmt]

      - title: Add a temporary protection
        text: |
          The real fix takes weeks to put in place. Until then, R-A's approvals are still going out without an independent check. An interim safeguard is a temporary protection that covers that gap until the fix is working.

          Choose the interim safeguard.
        fields:
          - id: interim_pick
            kind: select
            label: "Interim safeguard"
            options:
              - "A second reviewer checks every one of R-A's approvals until the fix is in place"
              - "Ask R-A to be more careful for now"
              - "Switch PolicyPal off until the fix is in place"
              - "Nothing: wait for the re-check date"
        answer: "`A second reviewer checks every one of R-A's approvals`. It closes the gap straight away and only for the approvals at risk. Asking R-A to be careful adds no check. Switching PolicyPal off punishes 1,900 employees for one reviewer's pattern. Doing nothing leaves the gap open for a month."
        show:
          - answers: [action]

  - id: verify
    title: Verification
    type: steps
    steps:
      - title: Choose when you will check again
        text: |
          Without a re-check date, "we will check later" never happens. The date comes from how often PolicyPal must be reviewed, which depends on its risk tier (Lab 1.1). The row below shows PolicyPal's.

          When should the plan say the fix will be checked?
        fields:
          - id: recheck_when
            kind: select
            label: "Re-check date"
            options:
              - "One week after the plan starts"
              - "One month after the plan starts"
              - "One quarter (three months) after the plan starts"
              - "Whenever the review team has time"
        answer: "`One month after the plan starts`. PolicyPal is Medium risk, and Medium-risk tools are reviewed monthly, so the re-check lines up with the next regular review. \"Whenever the review team has time\" is not a date, and never happens."
        show:
          - markdown: |
              | PolicyPal's risk tier | Review cadence |
              |---|---|
              | Medium | Monthly |

      - title: Choose the number that will mean it worked
        text: |
          "Improved" is not a number. The target must let someone who was not here look at the result and say plainly "yes, it worked" or "no, it did not".

          The numbers from the finding are below. Choose the measurable target.
        fields:
          - id: target_pick
            kind: select
            label: "Measurable target"
            options:
              - "R-A's reviewing improves"
              - "R-A's override rate is back within 5 points of the team average, over a two-week sample"
              - "R-A's override rate is 0%"
              - "No complaints about R-A from employees"
        answer: "`Within 5 points of the team average, over a two-week sample`. It is a number, measured over a stated period, so anyone can check it. \"Improves\" cannot be checked. 0% would mean R-A never disagrees at all, which is the problem itself. Employees never see the reviews, so they would not complain either way."
        show:
          - markdown: |
              | From the finding | |
              |---|---|
              | R-A's override rate | 2% (1 of 42 decisions) |
              | Team average override rate | 18% |
              | Weeks with a zero rate for R-A | 3 of 4 |

      - title: Choose where the number will come from
        text: |
          A target is only useful if you know where its number will come from. Choose the data you will look at on the re-check date. The sources you could use are described below.
        fields:
          - id: evidence_pick
            kind: select
            label: "Evidence for the re-check"
            options:
              - "A fresh export of the reviewer log for the re-check period"
              - "PolicyPal's activity log for the re-check period"
              - "R-A's manager's opinion"
              - "Employee complaints about PolicyPal"
        answer: "`A fresh export of the reviewer log`. It is the same list you measured R-A's override rate from in Lab 3.1, so the before and after numbers compare like with like. The activity log records PolicyPal's use and model, not reviewers' decisions. An opinion is not a number, and employees never see the reviews."
        show:
          - markdown: |
              | Source | What it records |
              |---|---|
              | The reviewer log | Every flagged case: what PolicyPal proposed, what the reviewer decided, and who the reviewer was |
              | PolicyPal's activity log | Every time PolicyPal was used: who, when, which AI model, and which documents it read |
              | R-A's manager | Their view of how R-A is doing |
              | Employee complaints | Problems employees report with PolicyPal's answers |
          - answers: [target_pick]

  - id: answer
    title: Remediation Plan
    type: report
    heading: Remediation Plan
    intro: "Workflow: PolicyPal. Owner: the function that runs the human review process for PolicyPal. First step: a second reviewer re-marks a sample of R-A's recent approvals to confirm the pattern. The test of a good plan: someone else, a month from now, can look at the verification section and say plainly whether the fix worked. To keep a copy, click Save as PDF."
    sections:
      - {title: "1. Finding", fields: [finding_stmt]}
      - {title: "2. Corrective action", fields: [action]}
      - {title: "3. Interim safeguard", fields: [interim_pick]}
      - {title: "4. Verification: re-check date", fields: [recheck_when]}
      - {title: "5. Verification: measurable target", fields: [target_pick]}
      - {title: "6. Verification: evidence", fields: [evidence_pick]}

