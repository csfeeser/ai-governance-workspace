title: Write the Escalation Ticket
tabs:
  - id: incident
    title: Triaged Incident
    type: doc
    source: triaged-incident.md
  - id: answer
    title: Escalation Ticket
    type: form
    heading: Escalation Ticket
    intro: "Fill every field. The test: could the receiving owner start work from this ticket without replying to ask you a question?"
    sections:
      - title: "Incident and category"
        help: "Copy from the triaged record on the Triaged Incident tab."
        fields:
          - {id: incident, kind: text, label: "Incident and category"}
      - title: "Routed to"
        help: "The responsible owner, named by what they are responsible for, not a department name."
        fields:
          - {id: routed, kind: text, label: "Routed to"}
      - title: "What was observed"
        help: "Behavior, not feeling. What the workflow is doing, described so anyone could confirm it."
        fields:
          - {id: observed, kind: textarea, rows: 3, label: "What was observed", example: "Draft replies are roughly 40% longer than before and fail the tone standard, not \"the assistant seems worse.\""}
      - title: "How often"
        help: "Use the number."
        fields:
          - {id: often, kind: text, label: "How often"}
      - title: "Over what period"
        help: "Start date and duration."
        fields:
          - {id: period, kind: text, label: "Over what period"}
      - title: "Evidence attached"
        help: "Name each piece of evidence and what it shows. The triage record summarizes each one; there is no separate file to open."
        fields:
          - {id: evidence, kind: textarea, rows: 3, label: "Evidence attached"}
      - title: "Already ruled out"
        help: "What you have already checked, so the receiver does not repeat your diagnosis."
        fields:
          - {id: ruledout, kind: textarea, rows: 2, label: "Already ruled out"}
      - title: "Business impact"
        help: "Quantified where possible."
        fields:
          - {id: impact, kind: textarea, rows: 2, label: "Business impact"}
      - title: "The ask"
        help: "The specific action you want the owner to take."
        fields:
          - {id: ask, kind: textarea, rows: 3, label: "The ask", example: "Confirm whether the model version can be pinned or rolled back, and advise a timeline."}
      - title: "Response-by"
        help: "Aligned to the urgency and the review cadence."
        fields:
          - {id: responseby, kind: text, label: "Response-by", example: "Initial response within 3 business days; this is customer-facing and ongoing."}
  - id: incident2
    title: "Bronze: Second Incident"
    type: doc
    optional: true
    source: triaged-incident-2.md
  - id: bronze
    title: "Bronze: Second Ticket"
    type: form
    optional: true
    sections_from: answer
    id_prefix: b-
    hide_examples: true
    heading: "Bronze: Escalation Ticket for the Data Exposure"
    intro: "Optional. Write the ticket for the security and privacy incident. The ask and the response-by are materially different from the model-swap ticket: this calls for immediate containment, not a next-cycle fix."
