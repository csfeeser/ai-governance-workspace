title: Baseline Re-Test and Business Quality Score
tabs:
  - id: files
    title: The Two Files
    type: steps
    steps:
      - title: Choose the file that shows whether answer quality is drifting
        text: |
          You own PolicyPal now. Part of that job is checking, on a regular schedule, whether the quality of its answers is starting to drift: slowly getting worse without anyone noticing. To check that, you need to see what PolicyPal actually said to employees.

          You asked the platform administrator for "the data". On most AI platforms, that request can mean two very different exports:

          - **An activity log** (also called an audit log): a record of who used the tool, when, from which app, and which AI model was running. It does not contain the questions or the replies. On Microsoft Copilot this comes from an audit search in Microsoft Purview. On Claude Enterprise it is the **Export logs** option in the admin settings.
          - **A content export:** the actual questions employees asked and the replies the AI gave. On Microsoft Copilot this is a separate request, made through an eDiscovery search in Purview. On Claude Enterprise it is the **Export data** option.

          Your administrator sent you one of each. Both are below: first the **Activity Log**, then the **Output Export**. Read the column headings across the top of each.

          Which of the two files is more useful for checking whether the quality of PolicyPal's answers is drifting?
        fields:
          - {id: scorable, kind: select, label: "Which file is more useful for checking whether answer quality is drifting?", options: ["Activity Log", "Output Export"]}
        answer: "`Output Export`. To judge the quality of an answer you have to be able to read the answer, and only the Output Export has the questions and PolicyPal's replies. The Activity Log has no answers in it. Keep it anyway: it records which AI model was running on each date, which you will need later in this lab."
        show:
          - markdown: "#### File 1: Activity Log"
          - table: {source: activity-log.csv, tools: false}
          - markdown: "#### File 2: Output Export"
          - table:
              source: output-export.csv
              tools: false
              hide: [baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4, baseline_bqs, current_score_c1, current_score_c2, current_score_c3, current_score_c4]
              labels: {case_id: Case, date: Date, employee_question: Question, assistant_response: Assistant response, cited_source: Cited source}

  - id: output
    title: Mark the Answers
    type: steps
    steps:
      - title: Mark five answers
        text: |
          Now you mark some of PolicyPal's answers, the way a teacher marks a test, against four rules for a good answer.

          The Quality Standard says a Medium-risk tool like PolicyPal needs 20 answers marked at every review. To save time in this lab, you mark only five of them. A colleague has already marked the other 15, and the workspace adds your five to theirs.

          Below this box are the four rules (section 3 of the Quality Standard), the correct figures from current policy (section 9), and the five answers.

          For each of the five answers:

          1. Read the `Question`, the `Assistant response`, and the `Cited source`.
          2. In each of the four last columns, choose `Met` if the answer passed that rule, or `Not met` if it failed.

          Look carefully. Not every answer is a good one.
        hints:
          - title: "Hint 1: how to mark each of the four rules"
            text: |
              - **c1:** Look at the `Cited source` column, not at the answer text. `Met` if it names a specific, current policy document. `Not met` if it is a vague phrase such as "company policy" or names an older version of a policy.
              - **c2:** `Met` if every number in the answer matches the table of reference figures. `Not met` if a number is different from the table, or is vague ("about", "roughly"). If the answer contains no numbers, choose `Met`, because there is nothing to get wrong.
              - **c3:** `Met` if the answer gives the specific thing the employee asked for. `Not met` if it only gives a general summary, or tells the employee to go and read the policy or check a website.
              - **c4:** This rule only applies to questions about an accommodation, a protected leave, or a decision the employee is disputing. `Met` if the answer sends the employee to a person in HR. For every other question, choose `Met`.
        answer: |
          - `BL-01`: `Met` for all four rules. It gives the exact figure (15 days) from the current policy.
          - `BL-11`: c4 `Not met`. The employee is disputing a decision, so PolicyPal should send them to a person in HR. Instead it decides the denial was fair and recommends what to do next. The other three rules are `Met`.
          - `BL-13`: c2 `Not met`. It says $0.65 per mile; the current figure is $0.67. The other three rules are `Met`.
          - `BL-17`: c3 `Not met`. The employee asked for a number of days and got a general summary and a pointer to the HR portal. The other three rules are `Met`.
          - `BL-19`: c1 and c3 `Not met`. It cites the superseded 2023 policy, and tells the employee to go and read the policy instead of answering. c2 and c4 are `Met`.
        show:
          - doc: quality-standard.md
            section: "3. Scoring criteria"
          - doc: quality-standard.md
            section: "9. Reference figures from current policy"
          - table:
              id: output
              source: output-export.csv
              tools: false
              where: {case_id: [BL-01, BL-11, BL-13, BL-17, BL-19]}
              hide: [date, baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4, baseline_bqs]
              labels:
                case_id: Case
                employee_question: Question
                assistant_response: Assistant response
                cited_source: Cited source
                current_score_c1: "c1 Named source"
                current_score_c2: "c2 Exact figure"
                current_score_c3: "c3 Answers question"
                current_score_c4: "c4 Human referral"
              editable:
                - {column: current_score_c1, options: &met [{value: "1", label: Met}, {value: "0", label: Not met}]}
                - {column: current_score_c2, options: *met}
                - {column: current_score_c3, options: *met}
                - {column: current_score_c4, options: *met}

      - title: "Optional: compare your five marks with someone else's"
        text: |
          This step is optional.

          Compare your marks below with a partner's, or with the instructor's answers. If you disagree on a mark, read the rule again together, agree what it means, and change any mark you now think is wrong in the step above.

          When an auditor asks "isn't this just your opinion?", this is the answer. The rules are written down, more than one person applied them to the same answers, and the marks agreed. (An auditor is a person whose job is to check a company's proof.)
        show:
          - table:
              id: output
              source: output-export.csv
              readonly: true
              tools: false
              where: {case_id: [BL-01, BL-11, BL-13, BL-17, BL-19]}
              hide: [date, employee_question, assistant_response, cited_source, baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4, baseline_bqs]
              fit: true
              labels: {case_id: Case, current_score_c1: "c1 Named source", current_score_c2: "c2 Exact figure", current_score_c3: "c3 Answers question", current_score_c4: "c4 Human referral"}
              editable:
                - {column: current_score_c1, options: *met}
                - {column: current_score_c2, options: *met}
                - {column: current_score_c3, options: *met}
                - {column: current_score_c4, options: *met}

  - id: result
    title: Your Result
    type: steps
    steps:
      - title: Is the quality of the answers going up or down?
        text: |
          The score box below adds up all 20 answers: your five marks and your colleague's 15. You do not have to do any maths. If it shows dashes, go back to the Mark the Answers tab and fill in the boxes you missed.

          The **Recorded baseline** is the score these same kinds of answers got when PolicyPal was first checked. Compare today's score with it. Then open **How each criterion moved** to see which rules changed.

          In a sentence or two, say whether the quality of PolicyPal's answers is going up or down, and how you can tell.
        fields:
          - {id: trending, kind: textarea, rows: 3, label: "Is the quality of the answers going up or down? How can you tell?"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "Quality is going ______. The score is ______ against a baseline of ______, ______ answers scored lower than they did at baseline, and the rule that dropped most is ______."'
        answer: "Down. The score is `81` against a recorded baseline of `88`, a drop of 7 points. `4` of the 20 answers scored lower than they did at baseline, and the rule that dropped most is `c3` (answers the question asked): several answers now give a general summary, or send the employee back to the policy, instead of the actual answer."
        show:
          - table: &scorepanel
              id: output
              source: output-export.csv
              view: scorecard
              editable:
                - {column: current_score_c1, options: *met}
                - {column: current_score_c2, options: *met}
                - {column: current_score_c3, options: *met}
                - {column: current_score_c4, options: *met}
              scorecard:
                baseline_bqs: baseline_bqs
                criteria:
                  - {label: "c1 Current, named source", current: current_score_c1, baseline: baseline_score_c1}
                  - {label: "c2 Exact figure or entitlement", current: current_score_c2, baseline: baseline_score_c2}
                  - {label: "c3 Answers the question asked", current: current_score_c3, baseline: baseline_score_c3}
                  - {label: "c4 Human referral where required", current: current_score_c4, baseline: baseline_score_c4}

      - title: Has the score reached the alarm level?
        text: |
          The company decided in advance what score should set off an alarm, so nobody has to guess after the fact. The alarm level (section 8 of the Quality Standard) and your score are below.

          Has PolicyPal's score reached the alarm level?
        fields:
          - {id: alarm_met, kind: select, label: "Has the score reached the alarm level?", options: ["Yes", "No"]}
        answer: "`Yes`. A score of 81 is below the floor of 85, and a drop of 7 points is more than the limit of 5. Either one alone would set off the alarm, so an investigation is needed."
        show:
          - doc: quality-standard.md
            section: "8. Quality alarm level"
          - table: *scorepanel

  - id: cause
    title: The Cause
    type: steps
    steps:
      - title: Find the most likely cause
        text: |
          The score has dropped, and the drop starts on a particular date. Now you find out why.

          1. In the first table below, the answers your colleague marked are in date order, with each answer's mark at baseline and its mark now (each out of 4). Find the first date on which an answer scored lower than it did at baseline.
          2. In the second table, the Activity Log shows which AI model was running each time PolicyPal was used, in the columns `ModelProviderName`, `ModelName`, and `ModelVersion`. Look at what changed around that date.

          Write what most likely caused the drop, and the date it happened.
        fields:
          - {id: cause, kind: textarea, rows: 3, label: "What most likely caused the drop in quality, and when?"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "The marks start to drop on ______. The day before, on ______, the ______ changed from ______ to ______."'
        answer: "The AI model changed. Answers score lower than their baseline from `2026-08-12`. On `2026-08-11`, the day before, the Activity Log shows `ModelName` changing from `gpt-4o` to `gpt-55-high` and `ModelVersion` from `2024-11-20` to `2025-06-15`. The company that makes the model stayed the same (`OpenAI`), so this is a new version from the same vendor. Lab 2.2 shows how to rule out the other possible causes."
        show:
          - markdown: "#### The answers your colleague marked, in date order"
          - table:
              source: output-export.csv
              tools: false
              where: {case_id: [BL-02, BL-03, BL-04, BL-05, BL-06, BL-07, BL-08, BL-09, BL-10, BL-12, BL-14, BL-15, BL-16, BL-18, BL-20]}
              computed:
                - {name: baseline_total, sum: [baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4]}
                - {name: current_total, sum: [current_score_c1, current_score_c2, current_score_c3, current_score_c4]}
              hide: [employee_question, assistant_response, cited_source, baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4, baseline_bqs, current_score_c1, current_score_c2, current_score_c3, current_score_c4]
              fit: true
              labels: {case_id: Case, date: Date, baseline_total: "Mark at baseline (of 4)", current_total: "Mark now (of 4)"}
          - markdown: "#### The Activity Log: which AI model was running"
          - table:
              source: activity-log.csv
              tools: false
              hide: [UserId, Operation, AppHost, AppIdentity, AgentName, AgentVersion, AccessedResources, SensitivityLabelId, XPIADetected, AISystemPlugin, MessageId, IsPrompt]

      - title: Decide who to speak to
        text: |
          Now that you know what most likely caused the drop, decide who needs to hear about it. Send it to whoever can change the thing that changed. Your answer from the last step is below.

          Choose who you would speak to, then write one line saying why.
        fields:
          - id: handoff_to
            kind: select
            label: "Who do you speak to about the drop in quality?"
            options:
              - "The platform / technical owner"
              - "The team that owns the HR policy library"
              - "The HR operations reviewers"
              - "No one yet; keep watching"
          - {id: contact_why, kind: text, label: "Why? One line."}
        answer: "`The platform / technical owner`. The cause is a change of AI model, and the model is run by the platform team, not by the business. They are the ones who can find out why the model changed, and whether it can be changed back."
        show:
          - answers: [cause]

  - id: answer
    title: My Answer
    type: report
    heading: Baseline Re-Test Result
    intro: "The result of your check on PolicyPal's answer quality. To keep a copy, click Save as PDF."
    sections:
      - {title: "The file used to check answer quality", fields: [scorable]}
      - {title: "Is quality going up or down?", fields: [trending]}
      - {title: "The alarm level", fields: [alarm_met]}
      - {title: "The most likely cause", fields: [cause]}
      - {title: "Who to speak to", fields: [handoff_to, contact_why]}
