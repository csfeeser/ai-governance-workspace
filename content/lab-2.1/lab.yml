title: Baseline Re-Test and Business Quality Score
tabs:
  - id: files
    title: The Two Files
    type: steps
    steps:
      - title: Work out which file you can mark
        text: |
          You asked your administrator for "the data" on PolicyPal and got two files. Both are below this box.

          - The first file is the **Activity Log**.
          - The second file is the **Output Export**.

          You can only mark an answer if you can see the answer. One file has the questions employees asked and what PolicyPal replied. The other only records who used PolicyPal and when.

          Read the column headings across the top of each file, from left to right. Then choose the file that has the actual answers.
        fields:
          - {id: scorable, kind: select, label: "Which of the two files can be scored for quality?", options: ["Activity Log", "Output Export"]}
        answer: "`Output Export` is the file you can mark. The `Activity Log` has no answers in it, so it cannot be marked."
        show:
          - markdown: "#### File 1: Activity Log"
          - table: {source: activity-log.csv, tools: false}
          - markdown: "#### File 2: Output Export"
          - table:
              source: output-export.csv
              tools: false
              hide: [date, baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4, baseline_bqs, current_score_c1, current_score_c2, current_score_c3, current_score_c4]
              labels: {case_id: Case, employee_question: Question, assistant_response: Assistant response, cited_source: Cited source}

      - title: Say why you are keeping the Activity Log
        text: |
          You will not throw the Activity Log away, even though you cannot mark it. It might be useful later.

          Below are the Activity Log's date column and its three model columns: `ModelProviderName`, `ModelName`, and `ModelVersion`. The model columns say which AI model was running each time PolicyPal was used.

          Write one line saying why you are keeping the Activity Log.
        fields:
          - {id: keep_why, kind: text, label: "Why are you keeping the other file even though you cannot score it?"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "It records which ______ was running on each date, which could explain a ______ later."'
          - title: "Hint 2: an example answer"
            text: '"It shows which AI model was running on each date, which could explain a change in quality later."'
        show:
          - table:
              source: activity-log.csv
              tools: false
              hide: [UserId, Operation, AppHost, AppIdentity, AgentName, AgentVersion, AccessedResources, SensitivityLabelId, XPIADetected, AISystemPlugin, MessageId, IsPrompt]

  - id: output
    title: Mark the Answers
    type: steps
    steps:
      - title: Mark the first five answers
        text: |
          You will mark 20 answers PolicyPal gave, the way a teacher marks a test. Before you mark all 20, you mark five and check that you and another person mark the same way.

          Below this box are the rules for a good answer (section 3 of the Quality Standard), the correct figures from current policy (section 9), and the first five answers.

          For each answer from `BL-01` to `BL-05`:

          1. Read the `Assistant response` and the `Cited source`.
          2. In each of the four last columns, choose `Met` if the answer passed that rule, or `Not met` if it failed.
        hints:
          - title: "Hint 1: how to mark each of the four rules"
            text: |
              - **c1:** Look at the `Cited source` column, not at the answer text. `Met` if it names a specific, current policy document. `Not met` if it is a vague phrase such as "company policy" or names an older version of a policy.
              - **c2:** `Met` if every number in the answer matches the table of reference figures. `Not met` if a number is different from the table, or is vague ("about", "roughly"). If the answer contains no numbers, choose `Met`, because there is nothing to get wrong.
              - **c3:** `Met` if the answer gives the specific thing the employee asked for. `Not met` if it only gives a general summary, or tells the employee to go and read the policy or check a website.
              - **c4:** This rule only applies to questions about an accommodation, a protected leave, or a decision the employee is disputing. `Met` if the answer sends the employee to a person in HR. For every other question, choose `Met`.
        answer: "All five answers meet all four rules. Choose `Met` in every box for `BL-01` to `BL-05`."
        show:
          - doc: quality-standard.md
            section: "3. Scoring criteria"
          - doc: quality-standard.md
            section: "9. Reference figures from current policy"
          - table: &marking
              id: output
              source: output-export.csv
              tools: false
              where: {case_id: [BL-01, BL-02, BL-03, BL-04, BL-05]}
              hide: [date, baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4, baseline_bqs]
              labels:
                case_id: Case
                employee_question: Question
                assistant_response: Assistant response
                cited_source: Cited source
                current_score_c1: "c1 Named source"
                current_score_c2: "c2 Exact figure"
                current_score_c3: "c3 Answers question"
                current_score_c4: "c4 Human referral"
              editable:
                - {column: current_score_c1, options: &met [{value: "1", label: Met}, {value: "0", label: Not met}]}
                - {column: current_score_c2, options: *met}
                - {column: current_score_c3, options: *met}
                - {column: current_score_c4, options: *met}

      - title: Compare your five marks with someone else's
        text: |
          Compare your marks below with a partner's, or with the instructor's answers.

          If you disagree on a mark, read the rule again together, agree what it means, and change any mark you now think is wrong in the step above.

          When an auditor asks "isn't this just your opinion?", this step is the answer. The rules are written down, more than one person applied them to the same answers, and the marks agreed. (An auditor is a person whose job is to check a company's proof.)
        show:
          - table:
              id: output
              source: output-export.csv
              readonly: true
              tools: false
              where: {case_id: [BL-01, BL-02, BL-03, BL-04, BL-05]}
              hide: [date, employee_question, assistant_response, cited_source, baseline_score_c1, baseline_score_c2, baseline_score_c3, baseline_score_c4, baseline_bqs]
              labels: {case_id: Case, current_score_c1: "c1 Named source", current_score_c2: "c2 Exact figure", current_score_c3: "c3 Answers question", current_score_c4: "c4 Human referral"}
              editable:
                - {column: current_score_c1, options: *met}
                - {column: current_score_c2, options: *met}
                - {column: current_score_c3, options: *met}
                - {column: current_score_c4, options: *met}

      - title: Mark the other 15 answers
        text: |
          Mark `BL-06` to `BL-20` the same way. Every answer needs a mark, because the sample size of 20 is set by PolicyPal's risk tier. If you run short of time, the fix is to skip a rule, never to skip an answer.

          The rules and the reference figures are below again. The score box above the answers updates as you go, and shows the score once every box is filled in.
        hints:
          - title: "Hint 1: how to mark each of the four rules"
            text: |
              - **c1:** Look at the `Cited source` column, not at the answer text. `Met` if it names a specific, current policy document. `Not met` if it is a vague phrase such as "company policy" or names an older version of a policy.
              - **c2:** `Met` if every number in the answer matches the table of reference figures. `Not met` if a number is different from the table, or is vague ("about", "roughly"). If the answer contains no numbers, choose `Met`.
              - **c3:** `Met` if the answer gives the specific thing the employee asked for. `Not met` if it only gives a general summary, or tells the employee to go and read the policy or check a website.
              - **c4:** This rule only applies to questions about an accommodation, a protected leave, or a decision the employee is disputing. `Met` if the answer sends the employee to a person in HR. For every other question, choose `Met`.
          - title: "Hint 2: how to spot a wrong figure"
            text: "Click the `Cited source` heading to sort the answers. Answers about the same policy end up next to each other, so when two answers give different numbers for the same thing you can see it straight away. Look both numbers up in the reference figures: only the one that matches meets c2."
        answer: |
          Every box is `Met` except these:

          - `BL-09`: c1 Not met (cites "company policy")
          - `BL-10`: c2 Not met ("about $65"; the figure is $64)
          - `BL-11`: c4 Not met (a disputed decision, not sent to a person)
          - `BL-12`: c1 Not met (cites "the benefits guide")
          - `BL-13`: c2 Not met ($0.65; the figure is $0.67)
          - `BL-14`: c4 Not met (an accommodation request, not sent to a person)
          - `BL-15`: c1 and c4 Not met
          - `BL-16`: c1 and c2 Not met ("roughly $500", cites "company policy")
          - `BL-17`, `BL-18`, `BL-20`: c3 Not met (no specific answer)
          - `BL-19`: c1 and c3 Not met (cites the superseded 2023 policy, no specific answer)
        show:
          - doc: quality-standard.md
            section: "3. Scoring criteria"
          - doc: quality-standard.md
            section: "9. Reference figures from current policy"
          - table:
              <<: *marking
              where: {case_id: [BL-06, BL-07, BL-08, BL-09, BL-10, BL-11, BL-12, BL-13, BL-14, BL-15, BL-16, BL-17, BL-18, BL-19, BL-20]}
              scorecard: &card
                baseline_bqs: baseline_bqs
                criteria:
                  - {label: "c1 Current, named source", current: current_score_c1, baseline: baseline_score_c1}
                  - {label: "c2 Exact figure or entitlement", current: current_score_c2, baseline: baseline_score_c2}
                  - {label: "c3 Answers the question asked", current: current_score_c3, baseline: baseline_score_c3}
                  - {label: "c4 Human referral where required", current: current_score_c4, baseline: baseline_score_c4}

  - id: result
    title: Your Result
    type: steps
    steps:
      - title: Read your result
        text: |
          The score box below adds up all 80 of your marks. You do not have to do any maths. If it shows dashes, go back to the Mark the Answers tab and fill in the boxes you missed.

          From the score box, type:

          - your **Current Business Quality Score**
          - the **Change (points)**: your score minus the recorded baseline
          - the number of **Responses below their own baseline**: answers that now score lower than they did when the baseline was set
          - the rule (criterion) that lost the most passing answers. Open **How each criterion moved** and look for the biggest drop in the **Change** column.
        fields:
          - {id: current, kind: text, label: "Your current Business Quality Score"}
          - {id: change, kind: text, label: "Change in points (current minus baseline)"}
          - {id: below, kind: text, label: "How many responses scored below their own baseline?"}
          - {id: worst, kind: text, label: "Which criterion lost the most passing responses?"}
        answer: |
          If you marked carefully:

          - Current Business Quality Score: `81`
          - Change: `-7` (the recorded baseline is 88)
          - Responses below their own baseline: `4`
          - Criterion that lost the most: `c3` (answers the question asked). Several answers now give a general summary, or send the employee back to the policy, instead of giving the actual answer.
        show:
          - table: &scorepanel
              id: output
              source: output-export.csv
              view: scorecard
              editable:
                - {column: current_score_c1, options: *met}
                - {column: current_score_c2, options: *met}
                - {column: current_score_c3, options: *met}
                - {column: current_score_c4, options: *met}
              scorecard: *card

      - title: Check your result against the alarm level
        text: |
          The company decided in advance what score should set off an alarm. You compare your score with that line, so you are not guessing after the fact.

          Below are the alarm level (section 8 of the Quality Standard) and your score again. Write which of the two lines your result crosses, and whether that means an investigation is needed.
        fields:
          - {id: alarm, kind: textarea, rows: 2, label: "Which lines are crossed, and does this trigger a diagnosis?"}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "My score of ______ is ______ the floor of ______, and a drop of ______ points is ______ the limit of ______."'
        answer: "81 is below the 85 floor, and a 7-point drop is more than the 5-point limit. Both lines are crossed, so an investigation is needed."
        show:
          - doc: quality-standard.md
            section: "8. Quality alarm level"
          - table: *scorepanel

      - title: Say in one sentence whether quality has got worse
        text: |
          A clear summary sentence is what a busy manager will actually read.

          Write one sentence. It should say how much the score changed, whether the alarm level was crossed, and how many answers got worse. Your numbers are in the score box below.
        fields:
          - {id: degraded, kind: textarea, rows: 3, label: "One sentence that cites the change, whether the alarm level was crossed, and the count of responses below baseline."}
        hints:
          - title: "Hint 1: a sentence to start from"
            text: 'Fill in the blanks: "Business quality has ______ and has ______ the alarm level: the Business Quality Score fell ______ points from ______ to ______, and ______ of 20 responses scored below their recorded baseline."'
          - title: "Hint 2: an example answer"
            text: '"Business quality has degraded and has crossed the alarm level: the Business Quality Score fell 7 points from 88 to 81, below the 85 floor, and 4 of 20 baseline responses scored below their recorded baseline."'
        show:
          - table: *scorepanel

  - id: record
    title: Test Record
    type: steps
    steps:
      - title: Start the test record
        text: |
          A test record is a short written report of a check. Anyone reading it later should be able to see what you tested, when, and against what rules. You finish this record in Lab 2.2.

          The facts you need are below. Fill in all three boxes. For **When**, use today's date.
        fields:
          - {id: tr_what, kind: textarea, rows: 2, label: "What was tested (the workflow, and the baseline case set: ID range and count)"}
          - {id: tr_when, kind: text, label: "When (the date this test was run)"}
          - {id: tr_standard, kind: text, label: "Against what standard (name and version)"}
        hints:
          - title: "Hint 1: sentences to start from"
            text: |
              - What was tested: "The ______ workflow, using the ______-response baseline set, cases ______ to ______."
              - When: today's date.
              - Against what standard: the name of the standard.
          - title: "Hint 2: example answers"
            text: |
              - What was tested: "The PolicyPal workflow, using the 20-response baseline set, cases BL-01 to BL-20."
              - Against what standard: "The PolicyPal Business Quality Standard."
        show:
          - markdown: |
              | What you marked | |
              |---|---|
              | Workflow | PolicyPal |
              | Cases | `BL-01` to `BL-20` (20 responses) |
              | Standard you marked against | Business Quality Standard — PolicyPal |

      - title: Decide what to do first
        text: |
          Quality has got worse. You now decide whether to look for the cause yourself, or to hand the problem straight to the technical team.

          A symptom on its own is not much use to someone who has to fix it. Choose what you would do first, then write one line saying why.
        fields:
          - {id: handoff, kind: select, label: "Quality has degraded. What do you do first?", options: ["Investigate the cause myself first", "Hand it straight to the platform owner"]}
          - {id: handoff_why, kind: text, label: "Why? One line."}
        answer: "You look for the cause yourself first. You do not pass on a symptom. Lab 2.2 is where you find the cause and collect the proof the technical team would need."

  - id: answer
    title: My Answer
    type: report
    heading: Test Result and Test Record
    intro: "This is the record of your baseline re-test. Lab 2.2 finishes the test record. To keep a copy, click Save as PDF."
    sections:
      - {title: "Which file can you score?", fields: [scorable, keep_why]}
      - {title: "The result", fields: [current, change, below, worst]}
      - {title: "Check against the alarm level", fields: [alarm]}
      - {title: "Has business quality degraded?", fields: [degraded]}
      - {title: "The test record", fields: [tr_what, tr_when, tr_standard]}
      - {title: "The handoff", fields: [handoff, handoff_why]}
